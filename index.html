<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hands</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Shrikhand&display=swap" rel="stylesheet">

  <style>
    :root {
      --tan: #FDF0E6;
      --pink: #F08E80;
      --blue: #0B0D63;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      background: var(--tan);
      font-family: -apple-system, Helvetica, Arial, sans-serif;
    }

    /* Top bar + footer */
    .topbar, .footer {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      min-height: 5rem;
      padding: 1rem 2rem;
    }
    .topbar { background: var(--tan); }
    .footer { background: var(--blue); }

    .brand {
      margin: 0;
      font-family: 'Shrikhand', cursive;
      font-weight: 400;
      font-size: 2.5rem;
      line-height: 1;
      color: var(--pink);
    }

    /* Sections */
    .section { padding: 4rem 2rem; }
    .bg-tan  { background: var(--tan); }
    .bg-pink { background: var(--pink); }
    .bg-blue { background: var(--blue); }

    .section-title {
      margin: 0 0 2.5rem;
      font-family: 'Shrikhand', cursive;
      font-weight: 400;
      font-size: 4rem;
      line-height: 1.1;
      text-align: center;
    }
    .title-pink  { color: #F08E80; }
    .title-white { color: #ffffff; }
    .title-black { color: #000000; }
    .title-blue  { color: #0B0D63; }

    /* Block widths (always centred) */
    .block { margin: 0 auto 1.5rem; }
    .block:last-child { margin-bottom: 0; }
    .block-wide        { width: 100%; }
    .block-narrow      { width: max(70%, 360px); max-width: 100%; }
    .block-very-narrow { width: max(40%, 360px); max-width: 100%; }

    /* Mobile: every block goes full width */
    @media (max-width: 768px) {
      .topbar, .footer { padding: 0.75rem 1rem; }
      .section { padding: 2.5rem 1rem; }
      .section-title { font-size: 2.6rem; margin-bottom: 1.5rem; }
      .block-narrow, .block-very-narrow { width: 100%; }
    }
  </style>

  <!-- Chart.js is loaded once here. If a network filter blocks this CDN, each
       chart block has its own built-in fallback loader, so nothing breaks. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body>

  <header class="topbar">
    <h1 class="brand">Hands</h1>
  </header>

  <!-- Current scores (pez chart), tan, wide -->
  <section class="section bg-pink" id="current-scores" style="padding-top:0;">
      <div class="block block-wide">
        <style>
          /* Mobile only: shrink the row so all 4 bars stay on one line instead
             of wrapping. Desktop sizing (set inline by the JS below) is untouched. */
          @media (max-width: 768px) {
            #pez-score-row {
              flex-wrap: nowrap !important;
              gap: 0.6rem !important;
              padding: 0 0.5rem 1rem !important;
            }
            .pez-col  { width: 62px !important; }
            .pez-bar  { width: 16px !important; }
            .pez-img  { width: 58px !important; height: 58px !important; margin-top: -8px !important; }
            .pez-score-text { font-size: 1.15rem !important; margin-top: 4px !important; }
          }
        </style>
        <div id="pez-score-error" style="display:none; color:#5a1a12; font-weight:600; font-size:13px; text-align:center; padding:4px 4px 12px;"></div>
        <div id="pez-score-row" style="
            display:flex;
            align-items:flex-start;
            justify-content:center;
            flex-wrap:wrap;
            gap:5rem;
            max-width:1200px;
            margin:0 auto;
            padding:0 2rem 1rem;"></div>

        <script>
        (function () {
          var SPREADSHEET_ID = "198TfaZ2ax5TFMbp4SenEovT5tOKq-nN_tYhGevFfEs4";
          var SHEET_NAME = "Scores";
          var CSV_URL = "https://docs.google.com/spreadsheets/d/" + SPREADSHEET_ID +
            "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(SHEET_NAME);

          var MAX_BAR_HEIGHT = 200; // px, tallest possible bar (highest current score)
          var MIN_BAR_HEIGHT = 20;  // px, so a low/zero score still shows a visible stem

          // Scores!A1:D1 -> row index 0, columns A-D = indices 0-3
          var PLAYERS = [
            { name: "Adam",  col: 0, color: "#746CF0", image: "images/adam.webp" },
            { name: "Ewan",  col: 1, color: "#6CF0A6", image: "images/ewan.webp" },
            { name: "Gerry", col: 2, color: "#F0DB6C", image: "images/gerry.webp" },
            { name: "Jonny", col: 3, color: "#566070", image: "images/jonny.webp" }
          ];

          // Minimal CSV line parser (handles quoted fields containing commas)
          function parseCSV(text) {
            var rows = [];
            var lines = text.split(/\r\n|\n|\r/);
            for (var i = 0; i < lines.length; i++) {
              var line = lines[i];
              if (line === "") continue;
              var row = [];
              var field = "";
              var inQuotes = false;
              for (var j = 0; j < line.length; j++) {
                var ch = line[j];
                if (inQuotes) {
                  if (ch === '"' && line[j + 1] === '"') { field += '"'; j++; }
                  else if (ch === '"') { inQuotes = false; }
                  else { field += ch; }
                } else {
                  if (ch === '"') inQuotes = true;
                  else if (ch === ',') { row.push(field); field = ""; }
                  else { field += ch; }
                }
              }
              row.push(field);
              rows.push(row);
            }
            return rows;
          }

          function showError(msg) {
            var el = document.getElementById("pez-score-error");
            el.textContent = msg;
            el.style.display = msg ? "block" : "none";
          }

          function renderColumns(entries) {
            var row = document.getElementById("pez-score-row");
            row.innerHTML = "";

            var validValues = entries
              .map(function (e) { return e.value; })
              .filter(function (v) { return v !== null; });
            var maxScore = validValues.length ? Math.max.apply(null, validValues) : 1;
            var bars = [];

            entries.forEach(function (entry, index) {
              var player = entry.player;
              var score = entry.value;

              var col = document.createElement("div");
              col.className = "pez-col";
              col.style.display = "flex";
              col.style.flexDirection = "column";
              col.style.alignItems = "center";
              col.style.width = "176px";

              var barHeight = score === null
                ? MIN_BAR_HEIGHT
                : Math.max(MIN_BAR_HEIGHT, Math.round((score / maxScore) * MAX_BAR_HEIGHT));

              // Starts at 0 and animates down to its full height on load/refresh,
              // staggered slightly per player, matching the entrance animation the
              // Chart.js bar charts elsewhere on the page use.
              var bar = document.createElement("div");
              bar.className = "pez-bar";
              bar.style.width = "52px";
              bar.style.height = "0px";
              bar.style.background = player.color;
              bar.style.borderRadius = "0 0 16px 16px";
              bar.style.transition = "height 0.8s cubic-bezier(.22,1,.36,1) " + (index * 0.1) + "s";

              var img = document.createElement("img");
              img.className = "pez-img";
              img.src = player.image;
              img.alt = player.name;
              img.style.width = "168px";
              img.style.height = "168px";
              img.style.objectFit = "contain";
              img.style.marginTop = "-20px";
              img.style.display = "block";

              var scoreText = document.createElement("div");
              scoreText.className = "pez-score-text";
              scoreText.textContent = score === null ? "–" : score;
              scoreText.style.fontFamily = "'Shrikhand', cursive";
              scoreText.style.fontWeight = "400";
              scoreText.style.fontSize = "3.2rem";
              scoreText.style.color = player.color;
              scoreText.style.marginTop = "8px";

              col.appendChild(bar);
              col.appendChild(img);
              col.appendChild(scoreText);
              row.appendChild(col);
              bars.push({ el: bar, height: barHeight });
            });

            // Double rAF so the browser paints the 0px starting height first,
            // otherwise the transition to full height wouldn't be seen.
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                bars.forEach(function (b) { b.el.style.height = b.height + "px"; });
              });
            });
          }

          function loadData() {
            showError("");
            var bustCacheUrl = CSV_URL + "&_=" + Date.now();
            fetch(bustCacheUrl)
              .then(function (res) {
                if (!res.ok) {
                  throw new Error("Sheet request failed with status " + res.status + ". Check the sheet is shared as \"Anyone with the link – Viewer\".");
                }
                return res.text();
              })
              .then(function (text) {
                var rows = parseCSV(text);
                if (!rows.length) throw new Error("No data came back from the sheet.");
                var dataRow = rows[0] || [];
                var entries = PLAYERS.map(function (player) {
                  var raw = dataRow[player.col];
                  var val = (raw === undefined || raw.trim() === "") ? null : parseFloat(raw);
                  return { player: player, value: isNaN(val) ? null : val };
                });
                renderColumns(entries);
              })
              .catch(function (err) {
                console.error("Pez Score Chart: failed to load sheet data", err);
                showError("Couldn't load scores: " + err.message);
              });
          }

          loadData();
        })();
        </script>
      </div>
  </section>

  <!-- Section 1: no header, tan, narrow -->
  <section class="section bg-tan" id="add-round">
      <div class="block block-narrow">
        <div id="add-round-wrap" style="background:#FDF0E6; border-radius:8px; padding:20px; max-width:480px; margin:0 auto;">
          <div style="font-family:'Fraunces', serif; font-weight:700; font-size:20px; color:#000000; padding:0 0 16px;">Add Round</div>

          <form id="add-round-form">
            <div style="display:grid; grid-template-columns:auto 1fr 1fr; gap:10px 14px; align-items:center;">
              <div></div>
              <div style="font-size:12px; font-weight:700; color:#000000; text-align:center;">Score</div>
              <div style="font-size:12px; font-weight:700; color:#000000; text-align:center;">Beers</div>

              <label for="adamScore" style="display:flex; align-items:center; gap:7px; font-family:'Fraunces', serif; font-weight:700; color:#000000;"><span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#746CF0;"></span>Adam</label>
              <input type="number" step="any" id="adamScore" required style="width:100%; padding:8px; border-radius:6px; border:1px solid #d8c2b3; box-sizing:border-box;">
              <input type="number" step="1" min="0" id="adamBeers" required style="width:100%; padding:8px; border-radius:6px; border:1px solid #d8c2b3; box-sizing:border-box;">

              <label for="ewanScore" style="display:flex; align-items:center; gap:7px; font-family:'Fraunces', serif; font-weight:700; color:#000000;"><span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#6CF0A6;"></span>Ewan</label>
              <input type="number" step="any" id="ewanScore" required style="width:100%; padding:8px; border-radius:6px; border:1px solid #d8c2b3; box-sizing:border-box;">
              <input type="number" step="1" min="0" id="ewanBeers" required style="width:100%; padding:8px; border-radius:6px; border:1px solid #d8c2b3; box-sizing:border-box;">

              <label for="gerryScore" style="display:flex; align-items:center; gap:7px; font-family:'Fraunces', serif; font-weight:700; color:#000000;"><span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#F0DB6C;"></span>Gerry</label>
              <input type="number" step="any" id="gerryScore" required style="width:100%; padding:8px; border-radius:6px; border:1px solid #d8c2b3; box-sizing:border-box;">
              <input type="number" step="1" min="0" id="gerryBeers" required style="width:100%; padding:8px; border-radius:6px; border:1px solid #d8c2b3; box-sizing:border-box;">

              <label for="jonnyScore" style="display:flex; align-items:center; gap:7px; font-family:'Fraunces', serif; font-weight:700; color:#000000;"><span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#566070;"></span>Jonny</label>
              <input type="number" step="any" id="jonnyScore" required style="width:100%; padding:8px; border-radius:6px; border:1px solid #d8c2b3; box-sizing:border-box;">
              <input type="number" step="1" min="0" id="jonnyBeers" required style="width:100%; padding:8px; border-radius:6px; border:1px solid #d8c2b3; box-sizing:border-box;">
            </div>

            <div style="margin-top:16px;">
              <label for="calledBy" style="display:block; font-size:13px; font-weight:700; color:#000000; margin-bottom:6px;">Who called it?</label>
              <select id="calledBy" style="width:100%; padding:8px; border-radius:6px; border:1px solid #d8c2b3; box-sizing:border-box;">
                <option value="No Call" selected>No Call</option>
                <option value="Adam">Adam</option>
                <option value="Ewan">Ewan</option>
                <option value="Gerry">Gerry</option>
                <option value="Jonny">Jonny</option>
              </select>
            </div>

            <button type="submit" id="add-round-submit" style="
                margin-top:18px;
                width:100%;
                background:#0B0D63;
                color:#ffffff;
                border:none;
                border-radius:6px;
                padding:12px;
                font-family:'Fraunces', serif;
                font-weight:700;
                font-size:15px;
                cursor:pointer;">Add Round</button>

            <div id="add-round-status" style="margin-top:12px; font-size:13px; font-weight:600; display:none;"></div>
          </form>
        </div>

        <script>
        (function () {
          // Paste the URL from your Apps Script deployment (ends in /exec) here:
          var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyu3hEWoO5Qx_4iFyIghKgdF_aOqXhxwtZG7dZpj4s6iZG-Jlb1t659Jzu5Ca-2baGwsQ/exec";

          var form = document.getElementById("add-round-form");
          var submitBtn = document.getElementById("add-round-submit");
          var statusEl = document.getElementById("add-round-status");

          function showStatus(msg, isError) {
            statusEl.textContent = msg;
            statusEl.style.display = "block";
            statusEl.style.color = isError ? "#b3261e" : "#1a7a3c";
          }

          form.addEventListener("submit", function (e) {
            e.preventDefault();

            if (APPS_SCRIPT_URL.indexOf("YOUR_APPS_SCRIPT_URL_HERE") !== -1) {
              showStatus("Setup needed: paste your Apps Script URL into the code block first.", true);
              return;
            }

            var payload = {
              adamScore: document.getElementById("adamScore").value,
              ewanScore: document.getElementById("ewanScore").value,
              gerryScore: document.getElementById("gerryScore").value,
              jonnyScore: document.getElementById("jonnyScore").value,
              calledBy: document.getElementById("calledBy").value,
              adamBeers: document.getElementById("adamBeers").value,
              ewanBeers: document.getElementById("ewanBeers").value,
              gerryBeers: document.getElementById("gerryBeers").value,
              jonnyBeers: document.getElementById("jonnyBeers").value
            };

            submitBtn.disabled = true;
            submitBtn.textContent = "Adding...";
            statusEl.style.display = "none";

            // Apps Script web apps don't return CORS headers, so we use mode:"no-cors"
            // (meaning we can't read the response) with a text/plain content type
            // to avoid triggering a blocked CORS preflight request.
            fetch(APPS_SCRIPT_URL, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify(payload)
            })
              .then(function () {
                showStatus("Round added!", false);
                form.reset();
                document.getElementById("calledBy").value = "No Call";
              })
              .catch(function (err) {
                console.error("Add Round: failed to submit", err);
                showStatus("Couldn't submit — check your connection and try again.", true);
              })
              .finally(function () {
                submitBtn.disabled = false;
                submitBtn.textContent = "Add Round";
              });
          });
        })();
        </script>
      </div>
  </section>

  <!-- Section 2: The Recent, blue, wide -->
  <section class="section bg-blue" id="recent">
    <h2 class="section-title title-pink">The Recent</h2>
      <div class="block block-wide">
        <div id="recent-score-wrap" style="position:relative; background:#0B0D63; border-radius:8px; padding:16px;">
          <div style="font-family:'Fraunces', serif; font-weight:700; font-size:20px; color:#ffffff; padding:0 4px 8px;">Last Five Rounds</div>
          <div id="recent-score-error" style="display:none; color:#5a1a12; font-weight:600; font-size:13px; padding:4px 4px 12px;"></div>
          <div style="width:100%; height:150px;">
            <canvas id="recent-score-canvas"></canvas>
          </div>
        </div>

        <script>
        (function () {
          var CHART_JS_URLS = [
            "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js",
            "https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"
          ];

          var SPREADSHEET_ID = "198TfaZ2ax5TFMbp4SenEovT5tOKq-nN_tYhGevFfEs4";
          var SHEET_NAME = "Web";
          var CSV_URL = "https://docs.google.com/spreadsheets/d/" + SPREADSHEET_ID +
            "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(SHEET_NAME);

          var BACKGROUND_COLOR = "#0B0D63";

          // Web!E2:H2 -> row index 1, columns E-H = indices 4-7
          var PLAYERS = [
            { name: "Adam",  col: 4, color: "#8D85FF" },
            { name: "Ewan",  col: 5, color: "#6CF0A6" },
            { name: "Gerry", col: 6, color: "#F0DB6C" },
            { name: "Jonny", col: 7, color: "#6F7989" }
          ];

          var chart = null;

          // Minimal CSV line parser (handles quoted fields containing commas)
          function parseCSV(text) {
            var rows = [];
            var lines = text.split(/\r\n|\n|\r/);
            for (var i = 0; i < lines.length; i++) {
              var line = lines[i];
              if (line === "") continue;
              var row = [];
              var field = "";
              var inQuotes = false;
              for (var j = 0; j < line.length; j++) {
                var ch = line[j];
                if (inQuotes) {
                  if (ch === '"' && line[j + 1] === '"') { field += '"'; j++; }
                  else if (ch === '"') { inQuotes = false; }
                  else { field += ch; }
                } else {
                  if (ch === '"') inQuotes = true;
                  else if (ch === ',') { row.push(field); field = ""; }
                  else { field += ch; }
                }
              }
              row.push(field);
              rows.push(row);
            }
            return rows;
          }

          function showError(msg) {
            var el = document.getElementById("recent-score-error");
            el.textContent = msg;
            el.style.display = msg ? "block" : "none";
          }

          function buildValues(rows) {
            var dataRow = rows[1] || [];
            return PLAYERS.map(function (player) {
              var raw = dataRow[player.col];
              var val = (raw === undefined || raw.trim() === "") ? null : parseFloat(raw);
              return { player: player, value: isNaN(val) ? null : val };
            });
          }

          // Plugin: fills the whole canvas with the block's background colour
          var backgroundPlugin = {
            id: "recentScoreBackground",
            beforeDraw: function (c) {
              var ctx = c.ctx;
              ctx.save();
              ctx.fillStyle = BACKGROUND_COLOR;
              ctx.fillRect(0, 0, c.width, c.height);
              ctx.restore();
            }
          };

          // Plugin: draws "Name  Value" in large Fraunces, in the player's colour,
          // to the right of the tip of each bar
          var nameValueLabelPlugin = {
            id: "recentScoreLabels",
            afterDatasetsDraw: function (c) {
              var ctx = c.ctx;
              var meta = c.getDatasetMeta(0);
              var entries = c.data.entries;

              entries.forEach(function (entry, i) {
                var point = meta.data[i];
                if (!point || entry.value === null) return;

                ctx.save();
                ctx.fillStyle = entry.player.color;
                ctx.font = "700 22px 'Fraunces', serif";
                ctx.textAlign = "left";
                ctx.textBaseline = "middle";
                ctx.fillText(entry.player.name + "  " + entry.value, point.x + 12, point.y);
                ctx.restore();
              });
            }
          };

          function renderChart(entries) {
            var ctx = document.getElementById("recent-score-canvas").getContext("2d");

            var config = {
              type: "bar",
              data: {
                labels: entries.map(function (e) { return e.player.name; }),
                entries: entries,
                datasets: [{
                  data: entries.map(function (e) { return e.value; }),
                  backgroundColor: entries.map(function (e) { return e.player.color; }),
                  borderWidth: 0,
                  borderRadius: 4,
                  categoryPercentage: 0.85,
                  barPercentage: 0.95
                }]
              },
              options: {
                indexAxis: "y",
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: { right: 170, top: 8, bottom: 8, left: 4 } },
                scales: {
                  x: { display: false, grid: { display: false } },
                  y: { display: false, grid: { display: false } }
                },
                plugins: {
                  legend: { display: false },
                  tooltip: { enabled: false }
                }
              },
              plugins: [backgroundPlugin, nameValueLabelPlugin]
            };

            if (chart) {
              chart.destroy();
            }
            chart = new Chart(ctx, config);
          }

          function loadData() {
            showError("");
            var bustCacheUrl = CSV_URL + "&_=" + Date.now();
            fetch(bustCacheUrl)
              .then(function (res) {
                if (!res.ok) {
                  throw new Error("Sheet request failed with status " + res.status + ". Check the sheet is shared as \"Anyone with the link – Viewer\".");
                }
                return res.text();
              })
              .then(function (text) {
                var rows = parseCSV(text);
                if (!rows.length) throw new Error("No data came back from the sheet.");
                var entries = buildValues(rows);
                renderChart(entries);
              })
              .catch(function (err) {
                console.error("Recent Score: failed to load sheet data", err);
                showError("Couldn't load scores: " + err.message);
              });
          }

          function init() {
            loadData();
          }

          // Load Chart.js ourselves and only start once it has actually finished loading,
          // rather than relying on <script> tag order. Tries a couple of CDN mirrors
          // in case one is blocked by an extension/network filter.
          function loadChartJs(urls, index) {
            if (index >= urls.length) {
              showError("Couldn't load the charting library from any source (likely an ad-blocker or network filter blocking script CDNs).");
              return;
            }
            var s = document.createElement("script");
            s.src = urls[index];
            s.onload = init;
            s.onerror = function () { loadChartJs(urls, index + 1); };
            document.head.appendChild(s);
          }

          if (window.Chart) {
            init();
          } else {
            loadChartJs(CHART_JS_URLS, 0);
          }
        })();
        </script>
      </div>
      <div class="block block-wide">
        <div id="last-round-wrap" style="background:#0B0D63; border-radius:8px; padding:20px 20px 10px;">
          <div style="font-family:'Fraunces', serif; font-weight:700; font-size:20px; color:#ffffff; padding:0 4px 14px;">Last Round</div>

          var SPREADSHEET_ID = "198TfaZ2ax5TFMbp4SenEovT5tOKq-nN_tYhGevFfEs4";
          var SHEET_NAME = "Scores";
          var CSV_URL = "https://docs.google.com/spreadsheets/d/" + SPREADSHEET_ID +

          var PLAYERS = [

          ];

          var BACKGROUND_COLOR = "#F08E80";
          var chart = null;

          // Minimal CSV line parser (handles quoted fields containing commas)
          function parseCSV(text) {
            var rows = [];
            var lines = text.split(/\r\n|\n|\r/);
            for (var i = 0; i < lines.length; i++) {
              var line = lines[i];

              rows.push(row);

            return rows;

          function buildDatasets(rows) {
            // Sheet ranges start at row 3 (Scores!A3 etc), so skip the first two CSV rows.
            var dataRows = rows.slice(2);

            return PLAYERS.map(function (player) {

                return res.text();

              .then(function (text) {

          function loadChartJs(urls, index) {

          // Rows 25-29 (1-indexed sheet rows) => indices 24-28 in the parsed CSV array
          function buildPlayerValues(rows) {

          function computeSharedRange(playerValueSets) {
            var all = [];

              set.validValues.forEach(function (v) { if (v !== null) all.push(v); });
            });
            if (!all.length) return { min: 0, max: 1 };

            var dataMax = Math.max.apply(null, all);

            var lines = text.split(/\r\n|\n|\r/);

              var line = lines[i];
              if (line === "") continue;
              var row = [];
              var field = "";
              var inQuotes = false;
              for (var j = 0; j < line.length; j++) {
                var ch = line[j];
                if (inQuotes) {
                  if (ch === '"' && line[j + 1] === '"') { field += '"'; j++; }
                  else if (ch === '"') { inQuotes = false; }
                  else { field += ch; }
                } else {
                  if (ch === '"') inQuotes = true;
                  else if (ch === ',') { row.push(field); field = ""; }
                  else { field += ch; }
                }
              }
              row.push(field);
              rows.push(row);
            }
            return rows;
          }

          function showError(msg) {
            var el = document.getElementById("stats-grid-error");
            el.textContent = msg;
            el.style.display = msg ? "block" : "none";
          }

          function cell(text, opts) {
            opts = opts || {};
            var td = document.createElement(opts.header ? "th" : "td");
            td.textContent = text;
            td.style.textAlign = opts.align || "left";
            td.style.padding = opts.header ? "8px 14px 12px" : "5px 14px";
            td.style.color = opts.color || HEADER_COLOR;
            td.style.fontWeight = opts.bold ? "700" : "400";
            td.style.fontSize = opts.header ? "20px" : "14px";

              ? "2px solid " + DIVIDER_COLOR
              : "1px solid " + DIVIDER_COLOR;
            td.style.whiteSpace = "nowrap";
            return td;
          }

            // Stats!A1:E30 -> CSV rows 0-29 (30 rows), columns A-E (indices 0-4)
            var dataRows = rows.slice(0, 30);
            var headerRow = dataRows[0] || [];
            var bodyRows = dataRows.slice(1);

            tbody.innerHTML = "";

            var headTr = document.createElement("tr");
            headTr.appendChild(cell(headerRow[0] || "", { header: true, bold: true, color: HEADER_COLOR, dividerWeight: true }));
            for (var c = 1; c <= 4; c++) {

              }));

            // Data rows: column A label (white) + B:E values (player colours)
            bodyRows.forEach(function (row) {
              // Skip fully empty rows
              var hasContent = row.some(function (v) { return v && v.trim() !== ""; });
              if (!hasContent) return;

              var tr = document.createElement("tr");
              tr.appendChild(cell(row[0] || "", { color: HEADER_COLOR }));
              for (var c = 1; c <= 4; c++) {
                tr.appendChild(cell(row[c] || "", { align: "right", color: PLAYER_COLORS[c - 1] }));
              }
              tbody.appendChild(tr);
            });

            // Remove the bottom border on the very last row
            var lastRow = tbody.lastElementChild;
            if (lastRow) {
              Array.prototype.forEach.call(lastRow.children, function (td) {
                td.style.borderBottom = "none";
              });
            }
          }

          function loadData() {
            showError("");
            var bustCacheUrl = CSV_URL + "&_=" + Date.now();
            fetch(bustCacheUrl)
              .then(function (res) {
                if (!res.ok) {
                  throw new Error("Sheet request failed with status " + res.status + ". Check the sheet is shared as \"Anyone with the link – Viewer\".");
                }
                return res.text();
              })
              .then(function (text) {
                var rows = parseCSV(text);
                if (!rows.length) throw new Error("No data came back from the sheet.");
                renderTable(rows);
              })
              .catch(function (err) {
                console.error("Stats Grid: failed to load sheet data", err);

          }

          loadData();
        })();

          var WHITE = "#ffffff";
          var HIGHLIGHT_COLOR = "#0B0D63";
          var CORRECT_COLOR = "#2e7d32";
          var INCORRECT_COLOR = "#8b1a1a";
          var DIVIDER_COLOR = "rgba(255,255,255,0.4)";
 
          // Scores!A3:D403 -> columns A-D = indices 0-3
          var PLAYERS = [
            { name: "Adam",  col: 0, color: "#746CF0" },
            { name: "Ewan",  col: 1, color: "#6CF0A6" },
            { name: "Gerry", col: 2, color: "#F0DB6C" },
            { name: "Jonny", col: 3, color: "#566070" }
          ];
 
          // Entry tab: column E (index 4) = who called it ("No Call" or a player name)
          // column F (index 5) = 0/1 result formula, only meaningful when E isn't "No Call"
          var ENTRY_CALLED_COL = 4;
          var ENTRY_RESULT_COL = 5;
 
          // Minimal CSV line parser (handles quoted fields containing commas)
          function parseCSV(text) {
            var rows = [];
            var lines = text.split(/\r\n|\n|\r/);
            for (var i = 0; i < lines.length; i++) {
              var line = lines[i];

              var field = "";
              var inQuotes = false;

                  if (ch === '"' && line[j + 1] === '"') { field += '"'; j++; }
                  else if (ch === '"') { inQuotes = false; }
                  else { field += ch; }
                } else {
                  if (ch === '"') inQuotes = true;
                  else if (ch === ',') { row.push(field); field = ""; }

              }

            var prevWasFactor25 = PLAYERS.map(function () { return false; });
 
            scoresDataRows.forEach(function (row, rowIndex) {

                var raw = row[player.col];

                  highlight = isFactorOf25 && !prevWasFactor25[i];

                tr.appendChild(valueCell(raw, highlight));
              });

              tbody.appendChild(tr);
            });

            var lastRow = tbody.lastElementChild;
            if (lastRow) {

              }
              return res.text();
            }).then(parseCSV);
          }

              .catch(function (err) {
                console.error("Scoreboard Table: failed to load sheet data", err);
                showError("Couldn't load scores: " + err.message);
              });
          }
 
          loadData();
        })();
