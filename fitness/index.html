<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fitness</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --white-grey: #F5F6F7;   /* background colour: white grey */
      --light-grey: #E3E5E8;   /* background colour: light grey */
      --dark-blue:  #14295A;   /* header colour */
      --dark-grey:  #43474E;   /* chart lines + chart text */
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      background: var(--white-grey);
      color: var(--dark-grey);
      font-family: 'Open Sans', -apple-system, Helvetica, Arial, sans-serif;
    }

    /* Top bar + footer */
    .topbar, .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 5rem;
      padding: 1rem 2rem;
    }
    .topbar { background: var(--white-grey); position: relative; z-index: 20; }
    .footer { background: var(--dark-blue); }

    .brand {
      margin: 0;
      font-family: 'Open Sans', sans-serif;
      font-weight: 800;
      font-size: 2.5rem;
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--dark-blue);
    }
    .footer .brand { color: var(--white-grey); }

    /* Burger menu (page switcher) */
    .site-menu { position: relative; }
    .menu-toggle {
      display: flex; flex-direction: column; justify-content: center; gap: 6px;
      width: 48px; height: 48px; padding: 10px;
      background: transparent; border: none; border-radius: 8px; cursor: pointer;
    }
    .menu-toggle span {
      display: block; height: 4px; border-radius: 2px; background: var(--dark-blue);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .menu-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(10px) rotate(45deg); }
    .menu-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
    .menu-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-10px) rotate(-45deg); }
    .menu-toggle:focus-visible, .menu-panel a:focus-visible,
    .filter-btn:focus-visible { outline: 3px solid var(--dark-blue); outline-offset: 2px; }
    .menu-panel {
      position: absolute; top: calc(100% + 8px); right: 0; min-width: 190px;
      margin: 0; padding: 8px; list-style: none;
      background: #ffffff; border-radius: 8px; box-shadow: 0 8px 24px rgba(20,41,90,0.18);
    }
    .menu-panel[hidden] { display: none; }
    .menu-panel a {
      display: block; padding: 10px 14px; border-radius: 6px;
      font-weight: 700; font-size: 1.1rem; color: var(--dark-blue); text-decoration: none;
    }
    .menu-panel a:hover { background: var(--white-grey); }
    .menu-panel a[aria-current="page"] { background: var(--light-grey); }

    /* Sections */
    .section { padding: 4rem 2rem; }
    .bg-white-grey { background: var(--white-grey); }
    .bg-light-grey { background: var(--light-grey); }

    .inner { max-width: 1200px; margin: 0 auto; }

    .big-title {
      margin: 0 0 2.5rem;
      font-weight: 800;
      font-size: 4rem;
      line-height: 1.1;
      letter-spacing: -0.02em;
      text-align: center;
      color: var(--dark-blue);
    }

    .chart-block + .chart-block { margin-top: 3.5rem; }

    .chart-title {
      margin: 0;
      font-weight: 700;
      font-size: 2.8rem;
      line-height: 1.15;
      letter-spacing: -0.01em;
      text-align: center;
      color: var(--dark-blue);
    }
    .chart-sub {
      margin: 0.35rem 0 1.25rem;
      font-weight: 600;
      font-size: 1.1rem;
      text-align: center;
      color: var(--dark-grey);
    }

    .chart-box { position: relative; width: 100%; height: 380px; }
    .chart-box.short { height: 280px; }
    .chart-box.tall  { height: 440px; }

    .chart-error {
      display: none;
      margin: 0 0 1rem;
      padding: 0.75rem 1rem;
      border-left: 4px solid #D64545;
      background: #ffffff;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--dark-grey);
    }

    /* Biometrics filter (chart 13) */
    .filters {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem;
      margin: 0 0 1.25rem;
    }
    .filter-btn {
      padding: 0.45rem 1.1rem;
      border: 2px solid var(--dark-grey);
      border-radius: 999px;
      background: transparent;
      font: 600 0.95rem 'Open Sans', sans-serif;
      color: var(--dark-grey);
      cursor: pointer;
    }
    .filter-btn[aria-pressed="true"] { background: var(--dark-grey); color: #ffffff; }

    .updated {
      margin: 0;
      padding: 0 2rem 1rem;
      text-align: right;
      font-size: 0.8rem;
      color: var(--dark-grey);
      background: var(--white-grey);
    }

    @media (max-width: 768px) {
      .topbar, .footer { padding: 0.75rem 1rem; }
      .section { padding: 2.5rem 1rem; }
      .big-title { font-size: 2.6rem; margin-bottom: 1.5rem; }
      .chart-title { font-size: 1.9rem; }
      .chart-box { height: 320px; }
      .chart-box.short { height: 240px; }
      .chart-box.tall { height: 380px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .menu-toggle span { transition: none; }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body>

  <header class="topbar">
    <h1 class="brand">Fitness</h1>
    <nav class="site-menu" aria-label="Pages">
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu-panel" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="menu-panel" id="site-menu-panel" hidden>
        <li><a href="/">Hands</a></li>
        <li><a href="/fitness" aria-current="page">Fitness</a></li>
      </ul>
    </nav>
  </header>

  <!-- Charts 1–3: totals, white grey -->
  <section class="section bg-white-grey" id="totals">
    <div class="inner">
      <div class="chart-error" data-sheet="Monthly"></div>

      <div class="chart-block">
        <h2 class="chart-title">Total activities per month</h2>
        <p class="chart-sub">ex. cycling</p>
        <div class="chart-box"><canvas id="chart-1"></canvas></div>
      </div>

      <div class="chart-block">
        <h2 class="chart-title">Total exercises per month</h2>
        <p class="chart-sub">ex. cycling</p>
        <div class="chart-box"><canvas id="chart-2"></canvas></div>
      </div>

      <div class="chart-block">
        <h2 class="chart-title">Total exercises per month</h2>
        <p class="chart-sub">inc. cycling</p>
        <div class="chart-box"><canvas id="chart-3"></canvas></div>
      </div>
    </div>
  </section>

  <!-- Charts 4–6: Running, light grey -->
  <section class="section bg-light-grey" id="running">
    <div class="inner">
      <h2 class="big-title">Running</h2>
      <div class="chart-error" data-sheet="Monthly"></div>
      <div class="chart-block"><div class="chart-box short"><canvas id="chart-4"></canvas></div></div>
      <div class="chart-block"><div class="chart-box short"><canvas id="chart-5"></canvas></div></div>
      <div class="chart-block"><div class="chart-box short"><canvas id="chart-6"></canvas></div></div>
    </div>
  </section>

  <!-- Charts 7–9: Swimming, white grey -->
  <section class="section bg-white-grey" id="swimming">
    <div class="inner">
      <h2 class="big-title">Swimming</h2>
      <div class="chart-error" data-sheet="Monthly"></div>
      <div class="chart-block"><div class="chart-box short"><canvas id="chart-7"></canvas></div></div>
      <div class="chart-block"><div class="chart-box short"><canvas id="chart-8"></canvas></div></div>
      <div class="chart-block"><div class="chart-box short"><canvas id="chart-9"></canvas></div></div>
    </div>
  </section>

  <!-- Charts 10–11: Workouts, light grey -->
  <section class="section bg-light-grey" id="workouts">
    <div class="inner">
      <h2 class="big-title">Workouts</h2>
      <div class="chart-error" data-sheet="Monthly"></div>
      <div class="chart-block"><div class="chart-box short"><canvas id="chart-10"></canvas></div></div>
      <div class="chart-block"><div class="chart-box short"><canvas id="chart-11"></canvas></div></div>
    </div>
  </section>

  <!-- Charts 12–13: Biometrics, white grey -->
  <section class="section bg-white-grey" id="biometrics">
    <div class="inner">
      <h2 class="big-title">Biometrics</h2>
      <div class="chart-error" data-sheet="Record"></div>

      <div class="chart-block">
        <div class="chart-box tall"><canvas id="chart-12"></canvas></div>
      </div>

      <div class="chart-block">
        <div class="filters" role="group" aria-label="Show category">
          <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-btn" type="button" data-filter="HRV" aria-pressed="false">HRV</button>
          <button class="filter-btn" type="button" data-filter="RHR" aria-pressed="false">RHR</button>
          <button class="filter-btn" type="button" data-filter="Stress" aria-pressed="false">Stress</button>
        </div>
        <div class="chart-box tall"><canvas id="chart-13"></canvas></div>
      </div>
    </div>
  </section>

  <p class="updated" id="last-updated" aria-live="polite"></p>

  <footer class="footer">
    <div class="brand">Fitness</div>
  </footer>

  <script>
  /* Burger menu */
  (function () {
    var btn = document.querySelector(".menu-toggle");
    var panel = document.getElementById("site-menu-panel");
    function setOpen(open) {
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      btn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
      panel.hidden = !open;
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); setOpen(panel.hidden); });
    document.addEventListener("click", function (e) {
      if (!panel.hidden && !panel.contains(e.target)) setOpen(false);
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !panel.hidden) { setOpen(false); btn.focus(); }
    });
  })();
  </script>

  <script>
  (function () {
    /* ------------------------------------------------------------------
       DATA SOURCE
       The sheet's "Publish to web" link. Each tab is requested by name.
       If a tab ever comes back wrong, put that tab's gid (the number after
       "gid=" in the sheet URL when that tab is open) into GIDS below and it
       will be used instead of the name.
       ------------------------------------------------------------------ */
    var PUB_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT8jr6FAFcoQxcHHNBgmZ1fruqkAWumO9wev3IEFvRFCUzOVj7rKNOYGF-GtEvur7ItS6Mc4YiClPN-/pub";
    var GIDS = { Monthly: "", Record: "" };

    // Monthly!A2:J73
    var MONTHLY_FIRST_ROW = 2;
    var MONTHLY_LAST_ROW  = 73;

    // Record!B367 onwards. Set RECORD_LAST_ROW to 1827 to stop there exactly;
    // null reads to the end of the sheet so new years are picked up automatically.
    var RECORD_FIRST_ROW = 367;
    var RECORD_LAST_ROW  = null;

    var REFRESH_MS = 5 * 60 * 1000; // re-check the sheet every 5 minutes

    var CHART_JS_URLS = [
      "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js",
      "https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"
    ];

    /* Colours */
    var DARK_GREY = "#43474E";
    var GRID      = "rgba(67,71,78,0.16)";
    var COLORS = {
      workout: "#D64545", // red
      swim:    "#2F6FD1", // blue
      run:     "#2E9E5B", // green
      cycle:   "#8C9199", // grey
      HRV:     "#D64545", // red
      RHR:     "#2F6FD1", // blue
      Stress:  "#E0A800"  // yellow
    };

    // Column letters -> 0-based indices
    var COL = { A: 0, B: 1, C: 2, D: 3, E: 4, F: 5, G: 6, H: 7, I: 8, J: 9 };

    var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    var DAY_MS = 86400000;

    var charts = {};
    var lastLoad = 0;
    var bioFilter = "all";

    /* ---------------- helpers ---------------- */

    // CSV parser that keeps blank lines so row numbers match the sheet
    function parseCSV(text) {
      var rows = [], row = [], field = "", inQuotes = false;
      for (var i = 0; i < text.length; i++) {
        var ch = text[i];
        if (inQuotes) {
          if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
          else if (ch === '"') inQuotes = false;
          else field += ch;
        } else if (ch === '"') inQuotes = true;
        else if (ch === ",") { row.push(field); field = ""; }
        else if (ch === "\r") { /* skip */ }
        else if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else field += ch;
      }
      if (field !== "" || row.length) { row.push(field); rows.push(row); }
      return rows;
    }

    // Numbers, including "1,234.5", "12 km" and durations like "12:30" or "1:05:00" (-> hours)
    function num(raw) {
      if (raw === undefined || raw === null) return null;
      var s = String(raw).trim();
      if (!s) return null;
      var t = s.match(/^(-?\d+):(\d{1,2})(?::(\d{1,2}))?$/);
      if (t) return (+t[1]) + (+t[2]) / 60 + (t[3] ? (+t[3]) / 3600 : 0);
      var v = parseFloat(s.replace(/,/g, ""));
      return isNaN(v) ? null : v;
    }

    function utc(y, m, d) { return new Date(Date.UTC(y, m, d)); }

    function todayUTC() {
      var n = new Date();
      return utc(n.getFullYear(), n.getMonth(), n.getDate());
    }

    function monthIndex(name) {
      var k = name.slice(0, 3).toLowerCase();
      for (var i = 0; i < 12; i++) if (MONTHS[i].toLowerCase() === k) return i;
      return -1;
    }

    // Accepts dd/mm/yyyy (UK first), yyyy-mm-dd, "Jan 2022", "January 2022",
    // "Jan-22", "1 Jan 2022" and Sheets serial numbers.
    function parseDate(raw) {
      if (!raw) return null;
      var s = String(raw).trim();
      if (!s) return null;
      var m;

      if (/^\d{5}(\.\d+)?$/.test(s)) return new Date(Date.UTC(1899, 11, 30) + Math.floor(+s) * DAY_MS);

      if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return utc(+m[1], +m[2] - 1, +m[3]);

      if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))) {
        var a = +m[1], b = +m[2], y = +m[3];
        if (y < 100) y += 2000;
        if (b > 12 && a <= 12) return utc(y, a - 1, b); // clearly mm/dd
        return utc(y, b - 1, a);                         // dd/mm
      }

      if ((m = s.match(/^(\d{1,2})[\s-]+([A-Za-z]{3,})[\s,-]+(\d{2,4})$/))) {
        var mi = monthIndex(m[2]); var yy = +m[3]; if (yy < 100) yy += 2000;
        if (mi >= 0) return utc(yy, mi, +m[1]);
      }

      if ((m = s.match(/^([A-Za-z]{3,})[\s,-]+(\d{1,2})?,?\s*(\d{2,4})$/))) {
        var mi2 = monthIndex(m[1]); var y2 = +m[3]; if (y2 < 100) y2 += 2000;
        if (mi2 >= 0) return utc(y2, mi2, m[2] ? +m[2] : 1);
      }

      var p = Date.parse(s);
      if (!isNaN(p)) { var d = new Date(p); return utc(d.getFullYear(), d.getMonth(), d.getDate()); }
      return null;
    }

    function fmt(v, unit) {
      if (v === null || v === undefined) return "–";
      var r = Math.round(v * 10) / 10;
      return (r % 1 === 0 ? r.toFixed(0) : r.toFixed(1)) + (unit ? " " + unit : "");
    }

    // Shift a hex colour lighter (t > 0, toward white) or darker (t < 0, toward black)
    function shade(hex, t) {
      var n = parseInt(hex.slice(1), 16);
      var c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (x) {
        return Math.round(t >= 0 ? x + (255 - x) * t : x * (1 + t));
      });
      return "#" + c.map(function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
    }

    function sheetURL(name) {
      var q = GIDS[name] ? "gid=" + GIDS[name] + "&single=true" : "sheet=" + encodeURIComponent(name);
      return PUB_URL + "?" + q + "&output=csv&_=" + Date.now();
    }

    function fetchSheet(name) {
      return fetch(sheetURL(name), { cache: "no-store" })
        .then(function (res) {
          if (!res.ok) throw new Error("the " + name + " tab returned status " + res.status + ". Check the sheet is still published to the web.");
          return res.text();
        })
        .then(function (text) {
          if (/^\s*</.test(text)) throw new Error("the " + name + " tab didn't come back as CSV. Check it's included in File → Share → Publish to web.");
          return parseCSV(text);
        });
    }

    function showError(sheet, msg) {
      document.querySelectorAll('.chart-error[data-sheet="' + sheet + '"]').forEach(function (el) {
        el.textContent = msg ? "Couldn't load " + msg : "";
        el.style.display = msg ? "block" : "none";
      });
    }

    /* ---------------- shared chart options ---------------- */

    function baseOptions(yTitle, opts) {
      opts = opts || {};
      return {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        layout: { padding: { top: 4, right: 8, bottom: 0, left: 0 } },
        scales: {
          x: {
            stacked: !!opts.stacked,
            grid: { display: false },
            border: { color: DARK_GREY },
            ticks: { color: DARK_GREY, maxRotation: 0, autoSkip: true, autoSkipPadding: 14,
                     font: { family: "'Open Sans', sans-serif", size: 12 } }
          },
          y: {
            stacked: !!opts.stacked,
            beginAtZero: opts.beginAtZero !== false,
            grid: { color: GRID },
            border: { display: false },
            ticks: { color: DARK_GREY, font: { family: "'Open Sans', sans-serif", size: 12 } },
            title: {
              display: !!yTitle, text: yTitle, color: DARK_GREY,
              font: { family: "'Open Sans', sans-serif", size: 13, weight: "600" }
            }
          }
        },
        plugins: {
          legend: {
            display: !!opts.legend,
            position: "top",
            labels: {
              color: DARK_GREY, usePointStyle: true, pointStyle: "rectRounded", boxWidth: 10, boxHeight: 10,
              padding: 16, font: { family: "'Open Sans', sans-serif", size: 13, weight: "600" }
            }
          },
          tooltip: {
            backgroundColor: "#2B2E33",
            titleFont: { family: "'Open Sans', sans-serif", weight: "700" },
            bodyFont: { family: "'Open Sans', sans-serif" },
            footerFont: { family: "'Open Sans', sans-serif", weight: "700" },
            padding: 10,
            boxPadding: 4,
            callbacks: {
              title: function (items) {
                return items.length && items[0].chart.data.titles
                  ? items[0].chart.data.titles[items[0].dataIndex]
                  : (items[0] ? items[0].label : "");
              },
              label: function (ctx) {
                return " " + ctx.dataset.label + ": " + fmt(ctx.parsed.y, opts.unit);
              },
              footer: opts.stacked ? function (items) {
                var total = 0, any = false;
                items.forEach(function (i) { if (i.parsed.y !== null) { total += i.parsed.y; any = true; } });
                return any ? "Total: " + fmt(total, opts.unit) : "";
              } : undefined
            }
          }
        }
      };
    }

    // Create a chart once, then update its data in place on later refreshes
    function upsert(id, type, data, options) {
      if (charts[id]) {
        charts[id].data.labels = data.labels;
        charts[id].data.titles = data.titles;
        data.datasets.forEach(function (ds, i) {
          if (charts[id].data.datasets[i]) charts[id].data.datasets[i].data = ds.data;
          else charts[id].data.datasets.push(ds);
        });
        charts[id].data.datasets.length = data.datasets.length;
        charts[id].update("none");
        return charts[id];
      }
      charts[id] = new Chart(document.getElementById(id), { type: type, data: data, options: options });
      return charts[id];
    }

    /* ---------------- Monthly tab: charts 1–11 ---------------- */

    function buildMonthly(rows) {
      var today = todayUTC();
      var last = Math.min(MONTHLY_LAST_ROW, rows.length);
      var out = [];
      for (var r = MONTHLY_FIRST_ROW; r <= last; r++) {
        var row = rows[r - 1] || [];
        var label = (row[COL.A] || "").trim();
        if (!label) continue;
        var d = parseDate(label);
        var get = function (c) { return num(row[COL[c]]); };
        var vals = { B: get("B"), C: get("C"), D: get("D"), E: get("E"), F: get("F"),
                     G: get("G"), H: get("H"), I: get("I"), J: get("J") };
        if (d) {
          if (d > today) continue; // only up to the current month
          out.push({ tick: MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear(),
                     title: MONTHS_LONG[d.getUTCMonth()] + " " + d.getUTCFullYear(), v: vals });
        } else {
          // Unrecognised month label: keep the row only if it has real data
          var hasData = Object.keys(vals).some(function (k) { return vals[k]; });
          if (hasData) out.push({ tick: label, title: label, v: vals });
        }
      }
      return out;
    }

    function series(months, col) { return months.map(function (m) { return m.v[col]; }); }

    function stackSet(label, months, col, color) {
      return { label: label, data: series(months, col), backgroundColor: color, borderWidth: 0,
               categoryPercentage: 0.8, barPercentage: 0.9 };
    }

    function singleSet(label, months, col, color) {
      return { label: label, data: series(months, col), backgroundColor: color, borderWidth: 0,
               borderRadius: 3, categoryPercentage: 0.8, barPercentage: 0.9 };
    }

    function renderMonthly(months) {
      var labels = months.map(function (m) { return m.tick; });
      var titles = months.map(function (m) { return m.title; });
      var data = function (sets) { return { labels: labels, titles: titles, datasets: sets }; };

      // Chart 1: activities (count), stacked
      upsert("chart-1", "bar", data([
        stackSet("Runs", months, "B", COLORS.run),
        stackSet("Swims", months, "C", COLORS.swim),
        stackSet("Workouts", months, "D", COLORS.workout)
      ]), baseOptions("quantity", { stacked: true, legend: true }));

      // Chart 2: hours ex. cycling, stacked
      upsert("chart-2", "bar", data([
        stackSet("Runs", months, "G", COLORS.run),
        stackSet("Swims", months, "H", COLORS.swim),
        stackSet("Workouts", months, "I", COLORS.workout)
      ]), baseOptions("hours", { stacked: true, legend: true, unit: "h" }));

      // Chart 3: hours inc. cycling, stacked
      upsert("chart-3", "bar", data([
        stackSet("Runs", months, "G", COLORS.run),
        stackSet("Swims", months, "H", COLORS.swim),
        stackSet("Workouts", months, "I", COLORS.workout),
        stackSet("Cycling", months, "J", COLORS.cycle)
      ]), baseOptions("hours", { stacked: true, legend: true, unit: "h" }));

      // Running
      upsert("chart-4", "bar", data([singleSet("Runs", months, "B", COLORS.run)]), baseOptions("runs"));
      upsert("chart-5", "bar", data([singleSet("Distance", months, "E", COLORS.run)]), baseOptions("km", { unit: "km" }));
      upsert("chart-6", "bar", data([singleSet("Time", months, "G", COLORS.run)]), baseOptions("hours", { unit: "h" }));

      // Swimming
      upsert("chart-7", "bar", data([singleSet("Swims", months, "C", COLORS.swim)]), baseOptions("swims"));
      upsert("chart-8", "bar", data([singleSet("Distance", months, "F", COLORS.swim)]), baseOptions("km", { unit: "km" }));
      upsert("chart-9", "bar", data([singleSet("Time", months, "H", COLORS.swim)]), baseOptions("hours", { unit: "h" }));

      // Workouts
      upsert("chart-10", "bar", data([singleSet("Workouts", months, "D", COLORS.workout)]), baseOptions("workouts"));
      upsert("chart-11", "bar", data([singleSet("Time", months, "I", COLORS.workout)]), baseOptions("hours", { unit: "h" }));
    }

    /* ---------------- Record tab: charts 12–13 ---------------- */

    var BIO = [
      { key: "HRV",    col: COL.H, unit: "ms"  },
      { key: "RHR",    col: COL.I, unit: "bpm" },
      { key: "Stress", col: COL.J, unit: ""    }
    ];

    function buildDays(rows) {
      var today = todayUTC();
      var last = RECORD_LAST_ROW ? Math.min(RECORD_LAST_ROW, rows.length) : rows.length;
      var days = [];
      for (var r = RECORD_FIRST_ROW; r <= last; r++) {
        var row = rows[r - 1] || [];
        var d = parseDate(row[COL.B]);
        if (!d || d > today) continue; // only up to today
        var v = {};
        BIO.forEach(function (b) {
          var n = num(row[b.col]);
          v[b.key] = n ? n : null; // blanks and 0s are treated as "no reading"
        });
        days.push({ date: d, v: v });
      }
      days.sort(function (a, b) { return a.date - b.date; });
      return days;
    }

    function avg(acc) { return acc && acc.n ? acc.s / acc.n : null; }

    // Chart 12: weekly averages (weeks start Monday)
    function renderWeekly(days) {
      var weeks = {}, order = [];
      days.forEach(function (day) {
        var dow = (day.date.getUTCDay() + 6) % 7;
        var start = new Date(day.date.getTime() - dow * DAY_MS);
        var k = start.getTime();
        if (!weeks[k]) { weeks[k] = { start: start }; order.push(k); }
        BIO.forEach(function (b) {
          var val = day.v[b.key];
          if (val === null) return;
          var acc = weeks[k][b.key] || (weeks[k][b.key] = { s: 0, n: 0 });
          acc.s += val; acc.n++;
        });
      });
      order.sort(function (a, b) { return a - b; });

      var labels = order.map(function (k) {
        var d = new Date(weeks[k].start.getTime() + 3 * DAY_MS); // label by the week's Thursday
        return MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear();
      });
      var titles = order.map(function (k) {
        var d = weeks[k].start;
        return "Week of " + d.getUTCDate() + " " + MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear();
      });

      var datasets = BIO.map(function (b) {
        return {
          label: b.key,
          data: order.map(function (k) { return avg(weeks[k][b.key]); }),
          borderColor: COLORS[b.key], backgroundColor: COLORS[b.key],
          borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: 0.3, spanGaps: true,
          unit: b.unit
        };
      });

      var options = baseOptions("", { legend: true, beginAtZero: false });
      options.plugins.legend.labels.pointStyle = "line";
      options.scales.x.ticks.maxTicksLimit = 12;
      options.plugins.tooltip.callbacks.label = function (ctx) {
        return " " + ctx.dataset.label + ": " + fmt(ctx.parsed.y, ctx.dataset.unit);
      };
      upsert("chart-12", "line", { labels: labels, titles: titles, datasets: datasets }, options);
    }

    // Chart 13: one year on the x axis, each year overlaid
    function renderYearOverlay(days) {
      var WEEKS = 52;
      var byYear = {};
      days.forEach(function (day) {
        var y = day.date.getUTCFullYear();
        var doy = Math.floor((day.date - utc(y, 0, 1)) / DAY_MS);
        var w = Math.min(WEEKS - 1, Math.floor(doy / 7)); // day 364/365 joins the last week
        var yr = byYear[y] || (byYear[y] = {});
        BIO.forEach(function (b) {
          var val = day.v[b.key];
          if (val === null) return;
          var arr = yr[b.key] || (yr[b.key] = []);
          var acc = arr[w] || (arr[w] = { s: 0, n: 0 });
          acc.s += val; acc.n++;
        });
      });
      var years = Object.keys(byYear).map(Number).sort();

      // Tick labels: month name on the week each month starts in, otherwise blank
      var labels = [], titles = [];
      for (var w = 0; w < WEEKS; w++) {
        var d = utc(2023, 0, 1 + w * 7);
        var prev = w ? utc(2023, 0, 1 + (w - 1) * 7) : null;
        labels.push(!prev || prev.getUTCMonth() !== d.getUTCMonth() ? MONTHS[d.getUTCMonth()] : "");
        titles.push("Week " + (w + 1) + " (from " + d.getUTCDate() + " " + MONTHS[d.getUTCMonth()] + ")");
      }

      var latest = years[years.length - 1];
      var datasets = [];
      BIO.forEach(function (b) {
        years.forEach(function (y, i) {
          // Oldest year lightest, newest year darkest
          var t = years.length > 1 ? 0.45 - (0.7 * i) / (years.length - 1) : 0;
          var color = shade(COLORS[b.key], t);
          var arr = (byYear[y] && byYear[y][b.key]) || [];
          var data = [];
          for (var w = 0; w < WEEKS; w++) data.push(avg(arr[w]));
          datasets.push({
            label: b.key + " " + y,
            category: b.key,
            data: data,
            borderColor: color, backgroundColor: color,
            borderWidth: y === latest ? 2.75 : 1.75,
            pointRadius: 0, pointHoverRadius: 4, tension: 0.3, spanGaps: true,
            unit: b.unit,
            hidden: bioFilter !== "all" && bioFilter !== b.key
          });
        });
      });

      var options = baseOptions("", { legend: true, beginAtZero: false });
      options.plugins.legend.labels.pointStyle = "line";
      options.plugins.legend.labels.filter = function (item, chartData) {
        var ds = chartData.datasets[item.datasetIndex];
        return bioFilter === "all" || ds.category === bioFilter;
      };
      options.interaction = { mode: "index", intersect: false };
      options.plugins.tooltip.filter = function (item) { return item.parsed.y !== null; };
      options.plugins.tooltip.callbacks.label = function (ctx) {
        return " " + ctx.dataset.label + ": " + fmt(ctx.parsed.y, ctx.dataset.unit);
      };
      options.scales.x.ticks.autoSkip = false;

      // The number of years can change (e.g. on 1 Jan), so rebuild rather than patch
      if (charts["chart-13"] && charts["chart-13"].data.datasets.length !== datasets.length) {
        charts["chart-13"].destroy();
        delete charts["chart-13"];
      }
      upsert("chart-13", "line", { labels: labels, titles: titles, datasets: datasets }, options);
      applyBioFilter();
    }

    function applyBioFilter() {
      var c = charts["chart-13"];
      if (!c) return;
      c.data.datasets.forEach(function (ds, i) {
        c.setDatasetVisibility(i, bioFilter === "all" || ds.category === bioFilter);
      });
      c.update();
    }

    document.querySelectorAll(".filter-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        bioFilter = btn.getAttribute("data-filter");
        document.querySelectorAll(".filter-btn").forEach(function (b) {
          b.setAttribute("aria-pressed", b === btn ? "true" : "false");
        });
        applyBioFilter();
      });
    });

    /* ---------------- loading ---------------- */

    function loadAll() {
      lastLoad = Date.now();
      var monthly = fetchSheet("Monthly")
        .then(function (rows) { showError("Monthly", ""); renderMonthly(buildMonthly(rows)); })
        .catch(function (err) { console.error("Fitness: Monthly", err); showError("Monthly", err.message); });

      var record = fetchSheet("Record")
        .then(function (rows) {
          showError("Record", "");
          var days = buildDays(rows);
          renderWeekly(days);
          renderYearOverlay(days);
        })
        .catch(function (err) { console.error("Fitness: Record", err); showError("Record", err.message); });

      Promise.all([monthly, record]).then(function () {
        var n = new Date();
        document.getElementById("last-updated").textContent =
          "Updated " + ("0" + n.getHours()).slice(-2) + ":" + ("0" + n.getMinutes()).slice(-2);
      });
    }

    function init() {
      loadAll();
      setInterval(function () { if (!document.hidden) loadAll(); }, REFRESH_MS);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && Date.now() - lastLoad > 60000) loadAll();
      });
    }

    function loadChartJs(urls, i) {
      if (i >= urls.length) {
        showError("Monthly", "the charting library from any source (an ad-blocker or network filter may be blocking script CDNs).");
        showError("Record", "the charting library from any source.");
        return;
      }
      var s = document.createElement("script");
      s.src = urls[i];
      s.onload = init;
      s.onerror = function () { loadChartJs(urls, i + 1); };
      document.head.appendChild(s);
    }

    if (window.Chart) init(); else loadChartJs(CHART_JS_URLS, 0);
  })();
  </script>

</body>
</html>
