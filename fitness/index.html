<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fitness</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --white-grey: #F5F6F7;   /* background colour: white grey */
      --light-grey: #E3E5E8;   /* background colour: light grey */
      --dark-blue:  #14295A;   /* header colour */
      --dark-grey:  #43474E;   /* chart lines + chart text */
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      background: var(--white-grey);
      color: var(--dark-grey);
      font-family: 'Open Sans', -apple-system, Helvetica, Arial, sans-serif;
    }

    /* Top bar + footer */
    .topbar, .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 5rem;
      padding: 1rem 2rem;
    }
    .topbar { background: var(--white-grey); position: relative; z-index: 20; }
    .footer { background: var(--dark-blue); }

    .brand {
      margin: 0;
      font-family: 'Open Sans', sans-serif;
      font-weight: 800;
      font-size: 2.5rem;
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--dark-blue);
    }
    .footer .brand { color: var(--white-grey); }

    /* Burger menu (page switcher) */
    .site-menu { position: relative; }
    .menu-toggle {
      display: flex; flex-direction: column; justify-content: center; gap: 6px;
      width: 48px; height: 48px; padding: 10px;
      background: transparent; border: none; border-radius: 8px; cursor: pointer;
    }
    .menu-toggle span {
      display: block; height: 4px; border-radius: 2px; background: var(--dark-blue);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .menu-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(10px) rotate(45deg); }
    .menu-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
    .menu-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-10px) rotate(-45deg); }
    .menu-toggle:focus-visible, .menu-panel a:focus-visible,
    .filter-btn:focus-visible { outline: 3px solid var(--dark-blue); outline-offset: 2px; }
    .menu-panel {
      position: absolute; top: calc(100% + 8px); right: 0; min-width: 190px;
      margin: 0; padding: 8px; list-style: none;
      background: #ffffff; border-radius: 8px; box-shadow: 0 8px 24px rgba(20,41,90,0.18);
    }
    .menu-panel[hidden] { display: none; }
    .menu-panel a {
      display: block; padding: 10px 14px; border-radius: 6px;
      font-weight: 700; font-size: 1.1rem; color: var(--dark-blue); text-decoration: none;
    }
    .menu-panel a:hover { background: var(--white-grey); }
    .menu-panel a[aria-current="page"] { background: var(--light-grey); }

    /* Sections */
    .section { padding: 4rem 2rem; }
    .bg-white-grey { background: var(--white-grey); }
    .bg-light-grey { background: var(--light-grey); }

    .inner { max-width: 1200px; margin: 0 auto; }

    .big-title {
      margin: 0 0 2.5rem;
      font-weight: 800;
      font-size: 2.8rem;
      line-height: 1.1;
      letter-spacing: -0.02em;
      text-align: center;
      color: var(--dark-blue);
    }

    .chart-block + .chart-block { margin-top: 3.5rem; }

    .big-title.with-sub { margin-bottom: 0; }
    .sub-title {
      margin: 0 0 1.25rem;
      font-weight: 700;
      font-size: 1.95rem;
      line-height: 1.15;
      text-align: center;
      color: var(--dark-blue);
    }
    .chart-sub {
      margin: 0.35rem 0 1.25rem;
      font-weight: 600;
      font-size: 1.1rem;
      text-align: center;
      color: var(--dark-grey);
    }

    .chart-box { position: relative; width: 100%; height: 380px; }
    .chart-box.short { height: 280px; }
    .chart-box.tall  { height: 440px; }

    .chart-error {
      display: none;
      margin: 0 0 1rem;
      padding: 0.75rem 1rem;
      border-left: 4px solid #D64545;
      background: #ffffff;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--dark-grey);
    }

    /* Biometrics filter (chart 13) */
    .filters {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem;
      margin: 0 0 1.25rem;
    }
    .filter-btn {
      padding: 0.45rem 1.1rem;
      border: 2px solid var(--dark-grey);
      border-radius: 999px;
      background: transparent;
      font: 600 0.95rem 'Open Sans', sans-serif;
      color: var(--dark-grey);
      cursor: pointer;
    }
    .filter-btn[aria-pressed="true"] { background: var(--dark-grey); color: #ffffff; }
    .cycling-toggle { margin-left: 0.75rem; border-color: #8C9199; }
    .cycling-toggle[aria-pressed="true"] { background: #8C9199; border-color: #8C9199; }
    .filter-btn[hidden] { display: none; }
    .vo2-toggle { margin-left: 0.75rem; }
    .vo2-toggle[aria-pressed="true"] { background: #F07F1E; border-color: #F07F1E; }
    .filters > .vo2-toggle:first-child { margin-left: 0; }
    .bio-filters { margin: 0 0 1.25rem; }
    .bio-filters .filters { margin: 0 0 0.6rem; }
    .swatch {
      display: inline-block; width: 10px; height: 10px; margin-right: 0.45rem;
      border-radius: 50%; vertical-align: 0;
    }
    .filter-btn[aria-pressed="true"] .swatch { box-shadow: 0 0 0 1.5px #ffffff; }

    .updated {
      margin: 0;
      padding: 0 2rem 1rem;
      text-align: right;
      font-size: 0.8rem;
      color: var(--dark-grey);
      background: var(--white-grey);
    }

    @media (max-width: 768px) {
      .topbar, .footer { padding: 0.75rem 1rem; }
      .section { padding: 2.5rem 1rem; }
      .big-title { font-size: 1.85rem; margin-bottom: 1.5rem; }
      .big-title.with-sub { margin-bottom: 0; }
      .sub-title { font-size: 1.4rem; }
      .chart-box { height: 320px; }
      .chart-box.short { height: 240px; }
      .chart-box.tall { height: 380px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .menu-toggle span { transition: none; }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body>

  <header class="topbar">
    <h1 class="brand">Fitness</h1>
    <nav class="site-menu" aria-label="Pages">
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu-panel" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="menu-panel" id="site-menu-panel" hidden>
        <li><a href="/">Hands</a></li>
        <li><a href="/fitness" aria-current="page">Fitness</a></li>
      </ul>
    </nav>
  </header>

  <!-- Totals, white grey -->
  <section class="section bg-white-grey" id="totals">
    <div class="inner">
      <div class="chart-error" data-sheet="Monthly"></div>

      <div class="chart-block">
        <h2 class="big-title with-sub" id="totals-title">Exercise</h2>
        <p class="chart-sub" id="totals-sub">per month</p>
        <div class="filters" role="group" aria-label="Show" data-group="totals">
          <button class="filter-btn" type="button" data-view="quantity" aria-pressed="true">Quantity</button>
          <button class="filter-btn" type="button" data-view="hours" aria-pressed="false">Hours</button>
          <button class="filter-btn cycling-toggle" type="button" id="cycling-toggle" aria-pressed="false" hidden>Show cycling</button>
          <button class="filter-btn vo2-toggle" type="button" data-vo2="totals" aria-pressed="false"><span class="swatch" style="background:#F07F1E"></span>VO2 Max</button>
        </div>
        <div class="chart-box"><canvas id="chart-totals"></canvas></div>
      </div>
    </div>
  </section>

  <!-- Running, light grey -->
  <section class="section bg-light-grey" id="running">
    <div class="inner">
      <h2 class="big-title with-sub">Running</h2>
      <p class="chart-sub">per month</p>
      <div class="chart-error" data-sheet="Monthly"></div>
      <div class="chart-block">
        <div class="filters" role="group" aria-label="Show" data-group="running">
          <button class="filter-btn" type="button" data-view="runs" aria-pressed="true">Runs</button>
          <button class="filter-btn" type="button" data-view="distance" aria-pressed="false">Distance</button>
          <button class="filter-btn" type="button" data-view="hours" aria-pressed="false">Hours</button>
          <button class="filter-btn vo2-toggle" type="button" data-vo2="running" aria-pressed="false"><span class="swatch" style="background:#F07F1E"></span>VO2 Max</button>
        </div>
        <div class="chart-box"><canvas id="chart-running"></canvas></div>
      </div>

      <div class="chart-block">
        <h3 class="sub-title">Totals</h3>
        <div class="chart-error" data-sheet="Running"></div>
        <div class="filters" role="group" aria-label="Show" id="running-totals-views">
          <button class="filter-btn" type="button" data-yview="distance" aria-pressed="true">Distance</button>
          <button class="filter-btn" type="button" data-yview="runs" aria-pressed="false">Runs</button>
          <button class="filter-btn" type="button" data-yview="range" aria-pressed="false">Range</button>
        </div>
        <div class="chart-box"><canvas id="chart-running-totals"></canvas></div>
      </div>
    </div>
  </section>

  <!-- Swimming, white grey -->
  <section class="section bg-white-grey" id="swimming">
    <div class="inner">
      <h2 class="big-title with-sub">Swimming</h2>
      <p class="chart-sub">per month</p>
      <div class="chart-error" data-sheet="Monthly"></div>
      <div class="chart-block">
        <div class="filters" role="group" aria-label="Show" data-group="swimming">
          <button class="filter-btn" type="button" data-view="swims" aria-pressed="true">Swims</button>
          <button class="filter-btn" type="button" data-view="distance" aria-pressed="false">Distance</button>
          <button class="filter-btn" type="button" data-view="hours" aria-pressed="false">Hours</button>
          <button class="filter-btn vo2-toggle" type="button" data-vo2="swimming" aria-pressed="false"><span class="swatch" style="background:#F07F1E"></span>VO2 Max</button>
        </div>
        <div class="chart-box"><canvas id="chart-swimming"></canvas></div>
      </div>
    </div>
  </section>

  <!-- Workouts, light grey -->
  <section class="section bg-light-grey" id="workouts">
    <div class="inner">
      <h2 class="big-title with-sub">Workouts</h2>
      <p class="chart-sub">per month</p>
      <div class="chart-error" data-sheet="Monthly"></div>
      <div class="chart-block">
        <div class="filters" role="group" aria-label="Show" data-group="workouts">
          <button class="filter-btn" type="button" data-view="workouts" aria-pressed="true">Workouts</button>
          <button class="filter-btn" type="button" data-view="hours" aria-pressed="false">Hours</button>
          <button class="filter-btn vo2-toggle" type="button" data-vo2="workouts" aria-pressed="false"><span class="swatch" style="background:#F07F1E"></span>VO2 Max</button>
        </div>
        <div class="chart-box"><canvas id="chart-workouts"></canvas></div>
      </div>
    </div>
  </section>

  <!-- Charts 12–13: Biometrics, white grey -->
  <section class="section bg-white-grey" id="biometrics">
    <div class="inner">
      <h2 class="big-title">Biometrics</h2>
      <div class="chart-error" data-sheet="Record"></div>

      <div class="chart-block">
        <div class="filters" role="group" aria-label="Show">
          <button class="filter-btn vo2-toggle" type="button" data-vo2="weekly" aria-pressed="false"><span class="swatch" style="background:#F07F1E"></span>VO2 Max</button>
        </div>
        <div class="chart-box tall"><canvas id="chart-12"></canvas></div>
      </div>

      <div class="chart-block">
        <div class="bio-filters">
          <div class="filters" role="group" aria-label="Categories" id="bio-cats">
            <button class="filter-btn" type="button" data-cat="HRV" aria-pressed="true"><span class="swatch" style="background:#D64545"></span>HRV</button>
            <button class="filter-btn" type="button" data-cat="RHR" aria-pressed="true"><span class="swatch" style="background:#2F6FD1"></span>RHR</button>
            <button class="filter-btn" type="button" data-cat="Stress" aria-pressed="true"><span class="swatch" style="background:#E0A800"></span>Stress</button>
            <button class="filter-btn" type="button" data-cat="VO2" aria-pressed="false"><span class="swatch" style="background:#F07F1E"></span>VO2 Max</button>
          </div>
          <div class="filters" role="group" aria-label="Years" id="bio-years"></div>
        </div>
        <div class="chart-box tall"><canvas id="chart-13"></canvas></div>
      </div>
    </div>
  </section>

  <p class="updated" id="last-updated" aria-live="polite"></p>

  <footer class="footer">
    <div class="brand">Fitness</div>
  </footer>

  <script>
  /* Burger menu */
  (function () {
    var btn = document.querySelector(".menu-toggle");
    var panel = document.getElementById("site-menu-panel");
    function setOpen(open) {
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      btn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
      panel.hidden = !open;
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); setOpen(panel.hidden); });
    document.addEventListener("click", function (e) {
      if (!panel.hidden && !panel.contains(e.target)) setOpen(false);
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !panel.hidden) { setOpen(false); btn.focus(); }
    });
  })();
  </script>

  <script>
  (function () {
    /* ------------------------------------------------------------------
       DATA SOURCE
       Google's published link only returns the FIRST tab unless you ask
       for a tab by its gid. To find a gid: open the sheet, click the tab,
       and copy the number after "gid=" at the end of the browser address
       (e.g. ...edit#gid=123456789 -> "123456789").
       ------------------------------------------------------------------ */
    var PUB_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT8jr6FAFcoQxcHHNBgmZ1fruqkAWumO9wev3IEFvRFCUzOVj7rKNOYGF-GtEvur7ItS6Mc4YiClPN-/pub";
    var GIDS = {
      Monthly: "539622156",
      Record:  "0",
      Running: "113863064"
    };

    // Monthly!A2:J73
    var MONTHLY_FIRST_ROW = 2;
    var MONTHLY_LAST_ROW  = 73;

    // Record!B367 onwards. Set RECORD_LAST_ROW to 1827 to stop there exactly;
    // null reads to the end of the sheet so new years are picked up automatically.
    var RECORD_FIRST_ROW = 367;
    var RECORD_LAST_ROW  = null;

    var REFRESH_MS = 5 * 60 * 1000; // re-check the sheet every 5 minutes

    var CHART_JS_URLS = [
      "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js",
      "https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"
    ];

    /* Colours */
    var DARK_GREY = "#43474E";
    var GRID      = "rgba(67,71,78,0.16)";
    var COLORS = {
      workout: "#D64545", // red
      swim:    "#2F6FD1", // blue
      run:     "#2E9E5B", // green
      cycle:   "#8C9199", // grey
      HRV:     "#D64545", // red
      RHR:     "#2F6FD1", // blue
      Stress:  "#E0A800", // yellow
      VO2:     "#F07F1E"  // orange
    };

    // Column letters -> 0-based indices
    var COL = { A: 0, B: 1, C: 2, D: 3, E: 4, F: 5, G: 6, H: 7, I: 8, J: 9, K: 10, L: 11 };

    // VO2 Max sits on its own right-hand axis with a fixed range
    var VO2_MIN = 30, VO2_MAX = 55;
    var vo2On = { totals: false, running: false, swimming: false, workouts: false, weekly: false };
    var vo2ByMonth = {};  // "year-month" -> monthly average VO2 Max
    var bioDays = null;   // last loaded Record days (for re-rendering chart 12)

    var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    var DAY_MS = 86400000;

    var charts = {};
    var lastLoad = 0;
    var bioCats  = { HRV: true, RHR: true, Stress: true, VO2: false }; // chart 13 category toggles
    var bioYears = {};                                       // chart 13 year toggles (new years default on)

    /* ---------------- helpers ---------------- */

    // CSV parser that keeps blank lines so row numbers match the sheet
    function parseCSV(text) {
      var rows = [], row = [], field = "", inQuotes = false;
      for (var i = 0; i < text.length; i++) {
        var ch = text[i];
        if (inQuotes) {
          if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
          else if (ch === '"') inQuotes = false;
          else field += ch;
        } else if (ch === '"') inQuotes = true;
        else if (ch === ",") { row.push(field); field = ""; }
        else if (ch === "\r") { /* skip */ }
        else if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else field += ch;
      }
      if (field !== "" || row.length) { row.push(field); rows.push(row); }
      return rows;
    }

    // Numbers, including "1,234.5", "12 km" and durations like "12:30" or "1:05:00" (-> hours)
    function num(raw) {
      if (raw === undefined || raw === null) return null;
      var s = String(raw).trim();
      if (!s) return null;
      var t = s.match(/^(-?\d+):(\d{1,2})(?::(\d{1,2}))?$/);
      if (t) return (+t[1]) + (+t[2]) / 60 + (t[3] ? (+t[3]) / 3600 : 0);
      var v = parseFloat(s.replace(/,/g, ""));
      return isNaN(v) ? null : v;
    }

    function utc(y, m, d) { return new Date(Date.UTC(y, m, d)); }

    function todayUTC() {
      var n = new Date();
      return utc(n.getFullYear(), n.getMonth(), n.getDate());
    }

    function monthIndex(name) {
      var k = name.slice(0, 3).toLowerCase();
      for (var i = 0; i < 12; i++) if (MONTHS[i].toLowerCase() === k) return i;
      return -1;
    }

    // Accepts dd/mm/yyyy (UK first), yyyy-mm-dd, "Jan 2022", "January 2022",
    // "Jan-22", "1 Jan 2022" and Sheets serial numbers.
    function parseDate(raw) {
      if (!raw) return null;
      var s = String(raw).trim();
      if (!s) return null;
      var m;

      if (/^\d{5}(\.\d+)?$/.test(s)) return new Date(Date.UTC(1899, 11, 30) + Math.floor(+s) * DAY_MS);

      if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return utc(+m[1], +m[2] - 1, +m[3]);

      if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))) {
        var a = +m[1], b = +m[2], y = +m[3];
        if (y < 100) y += 2000;
        if (b > 12 && a <= 12) return utc(y, a - 1, b); // clearly mm/dd
        return utc(y, b - 1, a);                         // dd/mm
      }

      if ((m = s.match(/^(\d{1,2})[\s-]+([A-Za-z]{3,})[\s,-]+(\d{2,4})$/))) {
        var mi = monthIndex(m[2]); var yy = +m[3]; if (yy < 100) yy += 2000;
        if (mi >= 0) return utc(yy, mi, +m[1]);
      }

      if ((m = s.match(/^([A-Za-z]{3,})[\s,-]+(\d{1,2})?,?\s*(\d{2,4})$/))) {
        var mi2 = monthIndex(m[1]); var y2 = +m[3]; if (y2 < 100) y2 += 2000;
        if (mi2 >= 0) return utc(y2, mi2, m[2] ? +m[2] : 1);
      }

      var p = Date.parse(s);
      if (!isNaN(p)) { var d = new Date(p); return utc(d.getFullYear(), d.getMonth(), d.getDate()); }
      return null;
    }

    function fmt(v, unit) {
      if (v === null || v === undefined) return "–";
      var r = Math.round(v * 10) / 10;
      return (r % 1 === 0 ? r.toFixed(0) : r.toFixed(1)) + (unit ? " " + unit : "");
    }

    // Shift a hex colour lighter (t > 0, toward white) or darker (t < 0, toward black)
    function shade(hex, t) {
      var n = parseInt(hex.slice(1), 16);
      var c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (x) {
        return Math.round(t >= 0 ? x + (255 - x) * t : x * (1 + t));
      });
      return "#" + c.map(function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
    }

    function sheetURL(name) {
      return PUB_URL + "?gid=" + encodeURIComponent(GIDS[name]) + "&single=true&output=csv&_=" + Date.now();
    }

    function fetchSheet(name) {
      if (!/^\d+$/.test(String(GIDS[name]).trim())) {
        return Promise.reject(new Error("the " + name + " tab: its gid hasn't been set yet. Add it to GIDS in the page's script."));
      }
      return fetch(sheetURL(name), { cache: "no-store" })
        .then(function (res) {
          if (res.status === 400) throw new Error("the " + name + " tab: Google says it isn't part of the published sheet. In Google Sheets, open File → Share → Publish to web, and make sure this tab is included.");
          if (!res.ok) throw new Error("the " + name + " tab returned status " + res.status + ". Check the sheet is still published to the web.");
          return res.text();
        })
        .then(function (text) {
          if (/^\s*</.test(text)) throw new Error("the " + name + " tab didn't come back as CSV. Check it's included in File → Share → Publish to web.");
          return parseCSV(text);
        });
    }

    function showError(sheet, msg) {
      document.querySelectorAll('.chart-error[data-sheet="' + sheet + '"]').forEach(function (el) {
        el.textContent = msg ? "Couldn't load " + msg : "";
        el.style.display = msg ? "block" : "none";
      });
    }

    /* ---------------- shared chart options ---------------- */

    function baseOptions(yTitle, opts) {
      opts = opts || {};
      return {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        layout: { padding: { top: 4, right: 8, bottom: 0, left: 0 } },
        scales: {
          x: {
            stacked: !!opts.stacked,
            grid: { display: false },
            border: { color: DARK_GREY },
            ticks: { color: DARK_GREY, maxRotation: 0, autoSkip: true, autoSkipPadding: 14,
                     font: { family: "'Open Sans', sans-serif", size: 12 } }
          },
          y: {
            stacked: !!opts.stacked,
            min: 0,
            beginAtZero: true,
            grid: { color: GRID },
            border: { display: false },
            ticks: { color: DARK_GREY, font: { family: "'Open Sans', sans-serif", size: 12 } },
            title: {
              display: !!yTitle, text: yTitle, color: DARK_GREY,
              font: { family: "'Open Sans', sans-serif", size: 13, weight: "600" }
            }
          },
          y1: {
            display: !!opts.vo2,
            position: "right",
            min: VO2_MIN,
            max: VO2_MAX,
            grid: { drawOnChartArea: false },
            border: { display: false },
            ticks: { color: DARK_GREY, font: { family: "'Open Sans', sans-serif", size: 12 } },
            title: {
              display: true, text: "VO2 Max", color: DARK_GREY,
              font: { family: "'Open Sans', sans-serif", size: 13, weight: "600" }
            }
          }
        },
        plugins: {
          legend: {
            display: !!opts.legend,
            position: "top",
            labels: {
              color: DARK_GREY, usePointStyle: true, pointStyle: "rectRounded", boxWidth: 10, boxHeight: 10,
              padding: 16, font: { family: "'Open Sans', sans-serif", size: 13, weight: "600" }
            }
          },
          tooltip: {
            backgroundColor: "#2B2E33",
            titleFont: { family: "'Open Sans', sans-serif", weight: "700" },
            bodyFont: { family: "'Open Sans', sans-serif" },
            footerFont: { family: "'Open Sans', sans-serif", weight: "700" },
            padding: 10,
            boxPadding: 4,
            callbacks: {
              title: function (items) {
                return items.length && items[0].chart.data.titles
                  ? items[0].chart.data.titles[items[0].dataIndex]
                  : (items[0] ? items[0].label : "");
              },
              label: function (ctx) {
                return " " + ctx.dataset.label + ": " + fmt(ctx.parsed.y, ctx.dataset.unit);
              },
              footer: opts.stacked ? function (items) {
                var total = 0, any = false;
                items.forEach(function (i) {
                  if (i.dataset.yAxisID === "y1") return; // VO2 Max isn't part of the stack total
                  if (i.parsed.y !== null) { total += i.parsed.y; any = true; }
                });
                return any ? "Total: " + fmt(total, items[0].dataset.unit) : "";
              } : undefined
            }
          }
        }
      };
    }

    // Round up to a tidy number just above the data's maximum
    function niceMax(v) {
      if (!v || v <= 0) return 1;
      var p = Math.pow(10, Math.floor(Math.log10(v)));
      var steps = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
      for (var i = 0; i < steps.length; i++) if (steps[i] * p >= v) return steps[i] * p;
      return 10 * p;
    }

    function dataMax(data, stacked) {
      var max = 0;
      var len = data.labels.length;
      for (var i = 0; i < len; i++) {
        var total = 0;
        data.datasets.forEach(function (ds) {
          if (ds.yAxisID === "y1") return;
          var v = ds.data[i];
          if (v === null || v === undefined || isNaN(v)) return;
          if (stacked) total += Math.max(0, v); else if (v > total) total = v;
        });
        if (total > max) max = total;
      }
      return niceMax(max);
    }

    // Create a chart once, then update its data in place on later refreshes
    function upsert(id, type, data, options) {
      var stacked = !!(options.scales.y && options.scales.y.stacked);
      options.scales.y.max = dataMax(data, stacked);
      var c = charts[id];
      if (c) {
        var sameSets = c.data.datasets.length === data.datasets.length &&
          c.data.datasets.every(function (ds, i) { return ds.label === data.datasets[i].label && ds.unit === data.datasets[i].unit; });
        c.data.labels = data.labels;
        c.data.titles = data.titles;
        c.data.years = data.years;
        if (sameSets) {
          // Background refresh: keep legend toggles, no re-animation
          data.datasets.forEach(function (ds, i) { c.data.datasets[i].data = ds.data; });
        } else {
          c.data.datasets = data.datasets; // view switched / VO2 toggled
          c.options = options;
        }
        c.options.scales.y.max = options.scales.y.max;
        c.options.scales.y.title.text = options.scales.y.title.text;
        c.options.scales.y.title.display = options.scales.y.title.display;
        c.update(sameSets ? "none" : undefined);
        return c;
      }
      charts[id] = new Chart(document.getElementById(id), { type: type, data: data, options: options });
      return charts[id];
    }

    /* ---------------- Monthly tab: charts 1–11 ---------------- */

    function buildMonthly(rows) {
      var today = todayUTC();
      var last = Math.min(MONTHLY_LAST_ROW, rows.length);
      var out = [];
      for (var r = MONTHLY_FIRST_ROW; r <= last; r++) {
        var row = rows[r - 1] || [];
        var label = (row[COL.A] || "").trim();
        if (!label) continue;
        var d = parseDate(label);
        var get = function (c) { return num(row[COL[c]]); };
        var vals = { B: get("B"), C: get("C"), D: get("D"), E: get("E"), F: get("F"),
                     G: get("G"), H: get("H"), I: get("I"), J: get("J") };
        if (d) {
          if (d > today) continue; // only up to the current month
          out.push({ key: d.getUTCFullYear() + "-" + d.getUTCMonth(), year: d.getUTCFullYear(), tick: MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear(),
                     title: MONTHS_LONG[d.getUTCMonth()] + " " + d.getUTCFullYear(), v: vals });
        } else {
          // Unrecognised month label: keep the row only if it has real data
          var hasData = Object.keys(vals).some(function (k) { return vals[k]; });
          if (hasData) out.push({ year: null, tick: label, title: label, v: vals });
        }
      }
      return out;
    }

    // Switchable charts: each view lists [label, column, colour key]
    var VIEWS = {
      totals: {
        canvas: "chart-totals", stacked: true, legend: true, current: "quantity",
        views: {
          quantity: { y: "quantity", title: "Total activities per month",
                      sets: [["Runs", "B", "run"], ["Swims", "C", "swim"], ["Workouts", "D", "workout"]] },
          hours:    { y: "hours", unit: "h", title: "Total exercises per month", cyclingToggle: true,
                      sets: [["Runs", "G", "run"], ["Swims", "H", "swim"], ["Workouts", "I", "workout"]] }
        }
      },
      running: {
        canvas: "chart-running", current: "runs",
        views: {
          runs:     { y: "runs",  sets: [["Runs", "B", "run"]] },
          distance: { y: "km",    unit: "km", sets: [["Distance", "E", "run"]] },
          hours:    { y: "hours", unit: "h",  sets: [["Time", "G", "run"]] }
        }
      },
      swimming: {
        canvas: "chart-swimming", current: "swims",
        views: {
          swims:    { y: "swims", sets: [["Swims", "C", "swim"]] },
          distance: { y: "km",    unit: "km", sets: [["Distance", "F", "swim"]] },
          hours:    { y: "hours", unit: "h",  sets: [["Time", "H", "swim"]] }
        }
      },
      workouts: {
        canvas: "chart-workouts", current: "workouts",
        views: {
          workouts: { y: "workouts", sets: [["Workouts", "D", "workout"]] },
          hours:    { y: "hours", unit: "h", sets: [["Time", "I", "workout"]] }
        }
      }
    };

    var monthsData = null;

    function vo2Dataset(data, extra) {
      var ds = {
        type: "line", label: "VO2 Max", unit: "", yAxisID: "y1", stack: "vo2",
        data: data, order: -1,
        borderColor: COLORS.VO2, backgroundColor: COLORS.VO2,
        borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 4, tension: 0.3, spanGaps: true
      };
      for (var k in extra) ds[k] = extra[k];
      return ds;
    }

    function monthlyData(months, sets, stacked, unit) {
      return {
        labels: months.map(function (m) { return m.tick; }),
        titles: months.map(function (m) { return m.title; }),
        years:  months.map(function (m) { return m.year; }),
        datasets: sets.map(function (s) {
          return {
            label: s[0], unit: unit || "",
            data: months.map(function (m) { return m.v[s[1]]; }),
            backgroundColor: COLORS[s[2]], borderWidth: 0,
            borderRadius: stacked ? 0 : 3,
            categoryPercentage: 0.8, barPercentage: 0.9
          };
        })
      };
    }

    var showCycling = false; // Hours view only: cycling (column J) on top of the stack

    function renderView(group) {
      var g = VIEWS[group], v = g.views[g.current];
      var withCycling = !!v.cyclingToggle && showCycling;

      if (group === "totals") {
        var toggle = document.getElementById("cycling-toggle");
        toggle.hidden = !v.cyclingToggle;
        toggle.setAttribute("aria-pressed", withCycling ? "true" : "false");
        toggle.textContent = showCycling ? "Hide cycling" : "Show cycling";
      }

      if (!monthsData) return;
      var sets = withCycling ? v.sets.concat([["Cycling", "J", "cycle"]]) : v.sets;
      var data = monthlyData(monthsData, sets, g.stacked, v.unit);
      if (vo2On[group]) {
        data.datasets.push(vo2Dataset(monthsData.map(function (m) {
          var val = vo2ByMonth[m.key];
          return val === undefined ? null : val;
        })));
      }
      upsert(g.canvas, "bar", data,
             baseOptions(v.y, { stacked: g.stacked, legend: g.legend, vo2: vo2On[group] }));
    }

    document.querySelectorAll(".vo2-toggle").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-vo2");
        vo2On[key] = !vo2On[key];
        btn.setAttribute("aria-pressed", vo2On[key] ? "true" : "false");
        if (key === "weekly") { if (bioDays) renderWeekly(bioDays); }
        else renderView(key);
      });
    });

    document.getElementById("cycling-toggle").addEventListener("click", function () {
      showCycling = !showCycling;
      renderView("totals");
    });

    function renderMonthly(months) {
      if (!months.length) throw new Error("any months from the Monthly tab. Check the Monthly gid points at the right tab and that column A from row 2 holds the months.");
      monthsData = months;
      Object.keys(VIEWS).forEach(renderView);
    }

    document.querySelectorAll(".filters[data-group]").forEach(function (groupEl) {
      var group = groupEl.getAttribute("data-group");
      groupEl.querySelectorAll(".filter-btn[data-view]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          VIEWS[group].current = btn.getAttribute("data-view");
          groupEl.querySelectorAll(".filter-btn[data-view]").forEach(function (b) {
            b.setAttribute("aria-pressed", b === btn ? "true" : "false");
          });
          renderView(group);
        });
      });
    });

    // Light grey vertical line + year label wherever the year changes.
    // Only drawn on charts that carry data.years (so not the year-overlay chart).
    var yearMarkerPlugin = {
      id: "yearMarkers",
      beforeDatasetsDraw: function (c) {
        var years = c.data.years;
        if (!years || !years.length) return;
        var x = c.scales.x, area = c.chartArea, ctx = c.ctx;
        ctx.save();
        ctx.strokeStyle = "#C3C7CD";
        ctx.lineWidth = 1;
        ctx.fillStyle = "rgba(67,71,78,0.75)";
        ctx.font = "600 11px 'Open Sans', sans-serif";
        ctx.textBaseline = "top";
        ctx.textAlign = "left";
        for (var i = 0; i < years.length; i++) {
          if (years[i] === null) continue;
          if (i === 0) { ctx.fillText(years[i], area.left + 4, area.top + 2); continue; }
          if (years[i] === years[i - 1]) continue;
          var px = (x.getPixelForValue(i - 1) + x.getPixelForValue(i)) / 2;
          ctx.beginPath();
          ctx.moveTo(Math.round(px) + 0.5, area.top);
          ctx.lineTo(Math.round(px) + 0.5, area.bottom);
          ctx.stroke();
          ctx.fillText(years[i], px + 4, area.top + 2);
        }
        ctx.restore();
      }
    };

    /* ---------------- Running tab: yearly totals ---------------- */

    // Running!A2:H7 -> one row per year (A = year)
    var RUNNING_FIRST_ROW = 2;
    var RUNNING_LAST_ROW  = 7;
    var RANGE_GREENS = ["#B5E2C3", "#7FC898", "#47A86C", "#2A8250", "#175A35"]; // light -> dark

    var RUN_TOTALS = {
      canvas: "chart-running-totals",
      current: "distance",
      views: {
        distance: { y: "km",   unit: "km", sets: [["Distance", "H", COLORS.run]] },
        runs:     { y: "runs", unit: "",   sets: [["Runs", "G", COLORS.run]] },
        range:    { y: "runs", unit: "", legend: true, sets: [
          ["<5 km", "B", RANGE_GREENS[0]], ["5 km", "C", RANGE_GREENS[1]], ["5 - 10 km", "D", RANGE_GREENS[2]],
          ["10 km", "E", RANGE_GREENS[3]], ["10 km+", "F", RANGE_GREENS[4]]
        ] }
      }
    };
    var runningYears = null;

    // Year cells may be plain years ("2022") or dates ("01/01/2022", "Jan 2022", "1/1/22")
    function parseYear(raw) {
      var str = String(raw || "").trim();
      if (!str) return NaN;
      var m = str.match(/(?:^|\D)((?:19|20)\d{2})(?:\D|$)/);
      if (m) return +m[1];
      var d = parseDate(str);
      return d ? d.getUTCFullYear() : NaN;
    }

    function buildRunningYears(rows) {
      var thisYear = new Date().getFullYear();
      var out = [];
      var last = Math.min(RUNNING_LAST_ROW, rows.length);
      for (var r = RUNNING_FIRST_ROW; r <= last; r++) {
        var row = rows[r - 1] || [];
        var year = parseYear(row[COL.A]);
        if (isNaN(year) || year > thisYear) continue; // only up to the current year
        var v = {};
        ["B", "C", "D", "E", "F", "G", "H"].forEach(function (c) { v[c] = num(row[COL[c]]); });
        out.push({ year: year, v: v });
      }
      if (!out.length) throw new Error("any years from the Running tab. Check the Running gid and that A2:A7 holds the years.");
      return out;
    }

    function renderRunningTotals() {
      if (!runningYears) return;
      var v = RUN_TOTALS.views[RUN_TOTALS.current];
      var labels = runningYears.map(function (y) { return String(y.year); });
      var data = {
        labels: labels,
        titles: labels,
        datasets: v.sets.map(function (set) {
          return {
            label: set[0], unit: v.unit,
            data: runningYears.map(function (y) { return y.v[set[1]]; }),
            backgroundColor: set[2], borderWidth: 0, borderRadius: 3,
            categoryPercentage: v.sets.length > 1 ? 0.8 : 0.6, barPercentage: 0.9
          };
        })
      };
      upsert(RUN_TOTALS.canvas, "bar", data, baseOptions(v.y, { legend: !!v.legend }));
    }

    document.querySelectorAll("#running-totals-views .filter-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        RUN_TOTALS.current = btn.getAttribute("data-yview");
        document.querySelectorAll("#running-totals-views .filter-btn").forEach(function (b) {
          b.setAttribute("aria-pressed", b === btn ? "true" : "false");
        });
        renderRunningTotals();
      });
    });

    /* ---------------- Record tab: charts 12–13 ---------------- */

    var BIO = [
      { key: "HRV",    col: COL.H, unit: "ms"  },
      { key: "RHR",    col: COL.I, unit: "bpm" },
      { key: "Stress", col: COL.J, unit: ""    },
      { key: "VO2",    col: COL.L, unit: "", label: "VO2 Max", axis: "y1", fill: true }
    ];

    function buildDays(rows) {
      var today = todayUTC();
      var last = RECORD_LAST_ROW ? Math.min(RECORD_LAST_ROW, rows.length) : rows.length;
      var days = [];
      for (var r = RECORD_FIRST_ROW; r <= last; r++) {
        var row = rows[r - 1] || [];
        var d = parseDate(row[COL.B]);
        if (!d || d > today) continue; // only up to today
        var v = {};
        BIO.forEach(function (b) {
          var n = num(row[b.col]);
          v[b.key] = n ? n : null; // blanks and 0s are treated as "no reading"
        });
        days.push({ date: d, v: v });
      }
      days.sort(function (a, b) { return a.date - b.date; });

      // VO2 Max is only entered when it changes: blank days carry the last value forward
      BIO.forEach(function (b) {
        if (!b.fill) return;
        var last = null;
        days.forEach(function (day) {
          if (day.v[b.key] === null) day.v[b.key] = last; else last = day.v[b.key];
        });
      });
      return days;
    }

    function avg(acc) { return acc && acc.n ? acc.s / acc.n : null; }

    function buildVo2ByMonth(days) {
      var acc = {};
      days.forEach(function (day) {
        var v = day.v.VO2;
        if (v === null) return;
        var k = day.date.getUTCFullYear() + "-" + day.date.getUTCMonth();
        var a = acc[k] || (acc[k] = { s: 0, n: 0 });
        a.s += v; a.n++;
      });
      var out = {};
      for (var k in acc) out[k] = avg(acc[k]);
      return out;
    }

    // Chart 12: weekly averages (weeks start Monday)
    function renderWeekly(days) {
      var weeks = {}, order = [];
      days.forEach(function (day) {
        var dow = (day.date.getUTCDay() + 6) % 7;
        var start = new Date(day.date.getTime() - dow * DAY_MS);
        var k = start.getTime();
        if (!weeks[k]) { weeks[k] = { start: start }; order.push(k); }
        BIO.forEach(function (b) {
          var val = day.v[b.key];
          if (val === null) return;
          var acc = weeks[k][b.key] || (weeks[k][b.key] = { s: 0, n: 0 });
          acc.s += val; acc.n++;
        });
      });
      order.sort(function (a, b) { return a - b; });

      var labels = order.map(function (k) {
        var d = new Date(weeks[k].start.getTime() + 3 * DAY_MS); // label by the week's Thursday
        return MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear();
      });
      var years = order.map(function (k) {
        return new Date(weeks[k].start.getTime() + 3 * DAY_MS).getUTCFullYear();
      });
      var titles = order.map(function (k) {
        var d = weeks[k].start;
        return "Week of " + d.getUTCDate() + " " + MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear();
      });

      var datasets = BIO.filter(function (b) { return b.key !== "VO2"; }).map(function (b) {
        return {
          label: b.key,
          data: order.map(function (k) { return avg(weeks[k][b.key]); }),
          borderColor: COLORS[b.key], backgroundColor: COLORS[b.key],
          borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: 0.3, spanGaps: true,
          unit: b.unit
        };
      });
      if (vo2On.weekly) {
        datasets.push(vo2Dataset(order.map(function (k) { return avg(weeks[k].VO2); }), { type: undefined }));
      }

      var options = baseOptions("", { legend: true, vo2: vo2On.weekly });
      options.plugins.legend.labels.pointStyle = "line";
      options.scales.x.ticks.maxTicksLimit = 12;
      options.plugins.tooltip.callbacks.label = function (ctx) {
        return " " + ctx.dataset.label + ": " + fmt(ctx.parsed.y, ctx.dataset.unit);
      };
      upsert("chart-12", "line", { labels: labels, titles: titles, years: years, datasets: datasets }, options);
    }

    // Chart 13: one year on the x axis, each year overlaid
    function renderYearOverlay(days) {
      var WEEKS = 52;
      var byYear = {};
      days.forEach(function (day) {
        var y = day.date.getUTCFullYear();
        var doy = Math.floor((day.date - utc(y, 0, 1)) / DAY_MS);
        var w = Math.min(WEEKS - 1, Math.floor(doy / 7)); // day 364/365 joins the last week
        var yr = byYear[y] || (byYear[y] = {});
        BIO.forEach(function (b) {
          var val = day.v[b.key];
          if (val === null) return;
          var arr = yr[b.key] || (yr[b.key] = []);
          var acc = arr[w] || (arr[w] = { s: 0, n: 0 });
          acc.s += val; acc.n++;
        });
      });
      var years = Object.keys(byYear).map(Number).sort();

      // Tick labels: month name on the week each month starts in, otherwise blank
      var labels = [], titles = [];
      for (var w = 0; w < WEEKS; w++) {
        var d = utc(2023, 0, 1 + w * 7);
        var prev = w ? utc(2023, 0, 1 + (w - 1) * 7) : null;
        labels.push(!prev || prev.getUTCMonth() !== d.getUTCMonth() ? MONTHS[d.getUTCMonth()] : "");
        titles.push("Week " + (w + 1) + " (from " + d.getUTCDate() + " " + MONTHS[d.getUTCMonth()] + ")");
      }

      var latest = years[years.length - 1];
      var datasets = [];
      BIO.forEach(function (b) {
        years.forEach(function (y, i) {
          // Oldest year lightest, newest year darkest
          var t = years.length > 1 ? 0.45 - (0.7 * i) / (years.length - 1) : 0;
          var color = shade(COLORS[b.key], t);
          var arr = (byYear[y] && byYear[y][b.key]) || [];
          var data = [];
          for (var w = 0; w < WEEKS; w++) data.push(avg(arr[w]));
          datasets.push({
            label: (b.label || b.key) + " " + y,
            category: b.key,
            yAxisID: b.axis || "y",
            data: data,
            borderColor: color, backgroundColor: color,
            borderWidth: y === latest ? 2.75 : 1.75,
            pointRadius: 0, pointHoverRadius: 4, tension: 0.3, spanGaps: true,
            unit: b.unit,
            year: y,
            hidden: !isBioVisible(b.key, y)
          });
        });
      });

      var options = baseOptions("", { legend: false });
      options.interaction = { mode: "index", intersect: false };
      options.plugins.tooltip.filter = function (item) { return item.parsed.y !== null; };
      options.plugins.tooltip.callbacks.label = function (ctx) {
        return " " + ctx.dataset.label + ": " + fmt(ctx.parsed.y, ctx.dataset.unit);
      };
      options.scales.x.ticks.autoSkip = false;

      // The number of years can change (e.g. on 1 Jan), so rebuild rather than patch
      if (charts["chart-13"] && charts["chart-13"].data.datasets.length !== datasets.length) {
        charts["chart-13"].destroy();
        delete charts["chart-13"];
      }
      upsert("chart-13", "line", { labels: labels, titles: titles, datasets: datasets }, options);
      renderYearButtons(years);
      applyBioFilter();
    }

    function isBioVisible(cat, year) {
      return !!bioCats[cat] && bioYears[year] !== false;
    }

    // Year buttons: built from the years in the data. The swatch uses the same
    // light-to-dark step as the lines (older = lighter, newer = darker).
    function renderYearButtons(years) {
      var wrap = document.getElementById("bio-years");
      var existing = Array.prototype.map.call(wrap.children, function (b) { return b.getAttribute("data-year"); }).join();
      if (existing === years.join()) return;
      wrap.innerHTML = "";
      years.forEach(function (y, i) {
        if (bioYears[y] === undefined) bioYears[y] = true;
        var t = years.length > 1 ? 0.45 - (0.7 * i) / (years.length - 1) : 0;
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "filter-btn";
        btn.setAttribute("data-year", y);
        btn.setAttribute("aria-pressed", bioYears[y] ? "true" : "false");
        btn.innerHTML = '<span class="swatch" style="background:' + shade(DARK_GREY, t) + '"></span>' + y;
        btn.addEventListener("click", function () {
          bioYears[y] = !bioYears[y];
          btn.setAttribute("aria-pressed", bioYears[y] ? "true" : "false");
          applyBioFilter();
        });
        wrap.appendChild(btn);
      });
    }

    function applyBioFilter() {
      var c = charts["chart-13"];
      if (!c) return;
      var visible = [];
      c.data.datasets.forEach(function (ds, i) {
        var show = isBioVisible(ds.category, ds.year);
        c.setDatasetVisibility(i, show);
        if (show) visible.push(ds);
      });
      // Rescale the left axis to the lines being shown; show each axis only when it has lines
      c.options.scales.y.max = dataMax({ labels: c.data.labels, datasets: visible }, false);
      c.options.scales.y.display = visible.some(function (ds) { return ds.yAxisID !== "y1"; });
      c.options.scales.y1.display = visible.some(function (ds) { return ds.yAxisID === "y1"; });
      c.update();
    }

    document.querySelectorAll("#bio-cats .filter-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var cat = btn.getAttribute("data-cat");
        bioCats[cat] = !bioCats[cat];
        btn.setAttribute("aria-pressed", bioCats[cat] ? "true" : "false");
        applyBioFilter();
      });
    });

    /* ---------------- loading ---------------- */

    function loadAll() {
      lastLoad = Date.now();
      var monthly = fetchSheet("Monthly")
        .then(function (rows) { showError("Monthly", ""); renderMonthly(buildMonthly(rows)); })
        .catch(function (err) { console.error("Fitness: Monthly", err); showError("Monthly", err.message); });

      var record = fetchSheet("Record")
        .then(function (rows) {
          showError("Record", "");
          var days = buildDays(rows);
          if (!days.length) throw new Error("any days from the Record tab. Check the Record gid points at the right tab and that column B from row 367 holds dates.");
          bioDays = days;
          vo2ByMonth = buildVo2ByMonth(days);
          renderWeekly(days);
          renderYearOverlay(days);
          if (monthsData) Object.keys(VIEWS).forEach(renderView);
        })
        .catch(function (err) { console.error("Fitness: Record", err); showError("Record", err.message); });

      var running = fetchSheet("Running")
        .then(function (rows) {
          showError("Running", "");
          runningYears = buildRunningYears(rows);
          renderRunningTotals();
        })
        .catch(function (err) { console.error("Fitness: Running", err); showError("Running", err.message); });

      Promise.all([monthly, record, running]).then(function () {
        var n = new Date();
        document.getElementById("last-updated").textContent =
          "Updated " + ("0" + n.getHours()).slice(-2) + ":" + ("0" + n.getMinutes()).slice(-2);
      });
    }

    function init() {
      Chart.register(yearMarkerPlugin);
      loadAll();
      setInterval(function () { if (!document.hidden) loadAll(); }, REFRESH_MS);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && Date.now() - lastLoad > 60000) loadAll();
      });
    }

    function loadChartJs(urls, i) {
      if (i >= urls.length) {
        showError("Monthly", "the charting library from any source (an ad-blocker or network filter may be blocking script CDNs).");
        showError("Record", "the charting library from any source.");
        return;
      }
      var s = document.createElement("script");
      s.src = urls[i];
      s.onload = init;
      s.onerror = function () { loadChartJs(urls, i + 1); };
      document.head.appendChild(s);
    }

    if (window.Chart) init(); else loadChartJs(CHART_JS_URLS, 0);
  })();
  </script>

</body>
</html>
